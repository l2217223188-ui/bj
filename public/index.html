  /* ================= 保存 ================= */
  function nextNo() {
    const d = new Date();
    const ymd = '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    const prefix = (DB.config.quotationPrefix || 'QJ') + '-' + ymd + '-';
    const n = (DB.quotations || []).filter(x => x.quotationNo && x.quotationNo.indexOf(prefix) === 0).length + 1;
    return prefix + String(n).padStart(3, '0');
  }

  /* 保存前：单价被手改过的柜体，问要不要同步回后台价格表 */
  function confirmPriceSync(diffs, onDone) {
    const old = document.querySelector('.sync-overlay');
    if (old) old.remove();
    const rows = diffs.map((d, k) => {
      const cab = d.cab;
      const rule = findPriceRule(cab) || {};
      const nm = [effName(cab, 'brand'), effName(cab, 'cabinetMaterial'), effName(cab, 'doorMaterial')]
        .filter(Boolean).join(' + ');
      return '<tr>' +
        '<td>' + (k + 1) + '</td>' +
        '<td>' + esc(cabLabel(cab)) + '<br><small style="color:#94a3b8">' + esc(cab.space || '') + ' · ' + esc(nm) + '</small></td>' +
        '<td class="num">¥' + fmt(d.backend) + '</td>' +
        '<td class="num" style="color:#b45309;font-weight:600">¥' + fmt(num(cab.priceInput)) + '</td>' +
        '<td class="num"><input type="checkbox" class="sync-ck" data-idx="' + k + '" checked></td>' +
      '</tr>';
    }).join('');

    const box = document.createElement('div');
    box.className = 'sync-overlay';
    box.innerHTML =
      '<div class="sync-card">' +
        '<h3>保存前确认：有 ' + diffs.length + ' 个柜体的单价和后台不一样</h3>' +
        '<p class="sync-tip">要不要把这些新价格写回「商品库设置 → 板材品类与价格」？<br>' +
          '勾选的会更新后台价格表，以后同样组合自动带出新价；不勾的只影响本单。</p>' +
        '<table class="sync-table"><thead><tr><th>#</th><th>柜体 / 组合</th><th style="text-align:right">后台价</th>' +
          '<th style="text-align:right">本单价</th><th style="text-align:right">写回后台</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>' +
        '<div class="sync-acts">' +
          '<button type="button" class="btn" data-sync="none">只保存本单，不改后台</button>' +
          '<button type="button" class="btn primary" data-sync="ok">同步选中的并保存</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(box);

    box.addEventListener('click', e => {
      const btn = e.target.closest('[data-sync]');
      if (e.target === box) return;   /* 点遮罩不关闭，避免误触 */
      if (!btn) return;
      if (btn.dataset.sync === 'ok') {
        const picks = Array.from(box.querySelectorAll('.sync-ck'))
          .filter(ck => ck.checked)
          .map(ck => diffs[Number(ck.dataset.idx)]);
        picks.forEach(d => {
          const rule = findPriceRule(d.cab);
          if (!rule) return;
          const np = num(d.cab.priceInput);
          if (d.cab.calcMode === MODE_METER) rule.priceM = np;
          else rule.priceSqm = np;
          d.cab.priceManual = false;
          applyAutoPrice(d.cab);
        });
        queueDbSave();
        toast(picks.length ? ('已更新 ' + picks.length + ' 条后台价格') : '未选中任何项，后台价格不变');
      }
      box.remove();
      onDone();
    });
  }

  async function saveQuotation() {
    if (draft && draft.cabinets && draft.cabinets.length) {
      const diffs = draft.cabinets
        .map(cab => ({ cab: cab, backend: priceDiffFromBackend(cab) }))
        .filter(d => d.backend !== null);
      if (diffs.length) {
        confirmPriceSync(diffs, () => { doSaveQuotation(); });
        return;
      }
    }
    doSaveQuotation();
  }

  async function doSaveQuotation(skipCheck) {
    if (!draft.cabinets.length) { toast('请至少添加一个柜体', true); return; }
    if (!skipCheck) {
      const probs = checkDraft();
      if (probs.length) { showDraftWarn(probs); return; }
    }
    const c = calc(draft);
    const noPrice = !!(window.__CTX && window.__CTX.canPrice === false);
    if (c.subtotal <= 0 && !noPrice && !draft.preset) { toast('报价金额为 0，请检查尺寸与单价', true); return; }

    const now = new Date().toISOString();
    /* 归属：新建时记当前账号；管理员打开别人的单保存时不改归属 */
    if (!draft.owner && ME) draft.owner = ME.username;
    if (!draft.id) draft.id = uid('q');
    /* 编号由服务端统一分配（多人同时开单不会撞号） */
    if (!draft.createdAt) draft.createdAt = now;
    draft.updatedAt = now;
    if (draft.status === 'draft' || draft.status === 'filled') {
      const isDesigner = !!(window.__CTX && window.__CTX.canPrice === false);
      draft.status = isDesigner ? (draft.preset ? 'quoted' : 'filled') : 'quoted';
    }

    const idx = DB.quotations.findIndex(x => x.id === draft.id);
    if (idx >= 0) DB.quotations[idx] = clone(draft);
    else DB.quotations.unshift(clone(draft));

    /* 保存时把本单用到、后台还没有的空间收进选项（只收空间，材质/类型不自动加） */
    const addedSpaces = [];
    if (!Array.isArray(DB.config.spaces)) DB.config.spaces = DEFAULT_SPACES.slice();
    (draft.cabinets || []).forEach(cab => {
      const s = String(cab.space || '').trim();
      if (s && DB.config.spaces.indexOf(s) < 0 && addedSpaces.indexOf(s) < 0) addedSpaces.push(s);
    });
    addedSpaces.forEach(s => DB.config.spaces.push(s));

    /* 顺带把本单用到的柜子名称收进名称库（下次可直接选） */
    const addedNames = [];
    if (!Array.isArray(DB.config.cabinetNames)) DB.config.cabinetNames = DEFAULT_CAB_NAMES.slice();
    (draft.cabinets || []).forEach(cab => {
      const s = String(cab.name || '').trim();
      if (s && DB.config.cabinetNames.indexOf(s) < 0 && addedNames.indexOf(s) < 0) addedNames.push(s);
    });
    addedNames.forEach(s => DB.config.cabinetNames.push(s));

    try {
      const saved = await putDb();
      if (saved && Array.isArray(saved.assigned)) {
        saved.assigned.forEach(a => {
          const q = (DB.quotations || []).find(x => x.id === a.id);
          if (q) q.quotationNo = a.quotationNo;
          if (draft.id === a.id) draft.quotationNo = a.quotationNo;
        });
      }
      dirty = false;
      setSaveState('已保存 ' + new Date().toLocaleTimeString('zh-CN'));
      toast('报价单已保存：' + draft.quotationNo +
        (addedSpaces.length ? '　已把「' + addedSpaces.join('、') + '」加入空间选项' : '') +
        (addedNames.length ? '　名称库新增「' + addedNames.join('、') + '」' : ''));
    } catch (e) {
      toast('保存失败：' + e.message, true);
    }
  }

  /* ---- 草稿自动留档：只要填了客户信息（尤其地址），就自动存一条记录 ---- */
  let draftRecordTimer = null;
  let draftRecordSaving = false;

  function scheduleDraftRecord() {
    if (!DB || !draft || tab !== 'booking') return;
    if (draft.status && draft.status !== 'draft') return;
    clearTimeout(draftRecordTimer);
    draftRecordTimer = setTimeout(persistDraftRecord, 1000);
  }

  async function persistDraftRecord() {
    if (!DB || !draft || draft.status !== 'draft') return;
    const cu = draft.customer || {};
    const filled = [cu.name, cu.phone, cu.address].some(v => String(v || '').trim() !== '');
    if (!filled) return;
    if (draftRecordSaving) { scheduleDraftRecord(); return; }
    draftRecordSaving = true;
    try {
      const now = new Date().toISOString();
      if (!draft.owner && ME) draft.owner = ME.username;
      if (!draft.id) draft.id = uid('q');
      if (!draft.createdAt) draft.createdAt = now;
      draft.updatedAt = now;
      const idx = DB.quotations.findIndex(x => x.id === draft.id);
      if (idx >= 0) {
        if (DB.quotations[idx].status !== 'draft') return;
        DB.quotations[idx] = clone(draft);
      } else {
        DB.quotations.unshift(clone(draft));
      }
      await putDb();
      setSaveState('草稿已自动留档');
    } catch (e) {
      /* 自动留档失败不打扰用户 */
    } finally {
      draftRecordSaving = false;
    }
  }

  /* ================= 事件 ================= */
  function currentCab(el) {
    const card = el.closest('[data-cab]');
    if (!card) return null;
    return draft.cabinets.find(c => c.id === card.dataset.cab) || null;
  }

  function refreshPriceField(card, cab) {
    const input = card.querySelector('[data-cf="priceInput"]');
    if (!input) return;
    const backend = resolveBackendPrice(cab);
    /* 单价始终可改；匹配到后台价时只是自动带出，不锁死 */
    input.readOnly = false;
    if (backend !== null) {
      input.value = String(effectiveUnitPrice(cab));
      input.style.background = cab.priceManual ? '#fffbf0' : '#f1f5f9';
    } else {
      input.style.background = '';
    }
    const tag = input.parentElement.querySelector('.cell-tag');
    if (tag) {
      const diff = priceDiffFromBackend(cab);
      if (diff !== null) { tag.className = 'cell-tag edit'; tag.textContent = '手改'; }
      else if (backend !== null) { tag.className = 'cell-tag ok'; tag.textContent = '后台'; }
      else { tag.className = 'cell-tag warn'; tag.textContent = '手填'; }
    }
    const hint = input.parentElement.querySelector('.hint.ok, .hint.warn');
    if (hint) {
      hint.className = 'hint ' + (backend !== null ? 'ok' : 'warn');
      hint.textContent = backend !== null ? '已匹配后台价格' : '后台无此组合，请手动填写';
    }
  }

  /* 顶部「统一设置」：改一次同步到全部柜体 */
  /* 取「统一设置」的当前值：各柜一致就用该值；不一致则用上次统一设置的值，再退回第一个柜体 */
  function globalCabValue(f) {
    if (!draft || !draft.cabinets.length) return '';
    const vals = draft.cabinets.map(c => String(c[f] == null ? '' : c[f]));
    if (vals.length && vals.every(v => v === vals[0]) && vals[0] !== '') return vals[0];
    if (globalCab && globalCab[f] !== undefined && globalCab[f] !== '') return globalCab[f];
    return '';
  }

  /* 找出「跟随统一设置」的柜体：值仍等于上次统一值（或当前多数值）的那些；其余视为已单独设置，批量时不动 */
  /* 跟随整单的柜体：follow 不为 false 的都跟着走；单独改过的（follow=false）不动 */
  function followerTargets(f) {
    const list = (draft && draft.cabinets) || [];
    const targets = list.filter(c => c.follow !== false);
    return { targets: targets, skipped: list.length - targets.length, prev: null };
  }

  function followCount() {
    const list = (draft && draft.cabinets) || [];
    return { on: list.filter(c => c.follow !== false).length, off: list.filter(c => c.follow === false).length };
  }

  function handleGlobalCabField(el) {
    const f = el.dataset.gcf;
    const v = el.value;
    if (v === '__mixed__') return;
    if (!draft || !draft.cabinets.length) return;
    if (!globalCab) globalCab = {};

    const picked = followerTargets(f);

    if (f === 'priceInput') {
      const r = readNum(el);
      if (r === null) return;
      picked.targets.forEach(c => { c.priceInput = r; });
      globalCab.priceInput = r;
      render();
      toast('单价已同步到 ' + picked.targets.length + ' 个柜体' + (picked.skipped ? '（' + picked.skipped + ' 个已单独设置，未改动）' : ''));
      return;
    }

    if (f === 'hardwareName') {
      const nm = (v === '__none__') ? '' : v;
      const preset = (DB.config.hardwareUpgrades || []).find(u => u.name === nm);
      picked.targets.forEach(c => {
        c.hardwareName = nm;
        /* 命中预设才覆盖加价；自定义名称保留各柜原有的加价 */
        if (preset) c.hardwarePrice = (preset.price === '' || preset.price === null) ? '' : String(preset.price);
        else if (!nm) c.hardwarePrice = '';
      });
      globalCab.hardwareName = nm;
      render();
      toast((nm ? '已把「' + nm + '」同步到 ' : '已取消五金升级：') + picked.targets.length + ' 个柜体' +
        (picked.skipped ? '（' + picked.skipped + ' 个已单独设置，未改动）' : ''));
      return;
    }

    picked.targets.forEach(c => {
      c[f] = v;
      /* 切到「其他（自定义）」时保留已填的自定义名，方便接着改名 */
      if (v !== OPT_CUSTOM) {
        if (f === 'brand') c.brandCustom = '';
        if (f === 'cabinetMaterial') c.cabinetMaterialCustom = '';
        if (f === 'doorMaterial') c.doorMaterialCustom = '';
      }
      applyAutoPrice(c);
    });
    globalCab[f] = v;
    render();

    const names = { brand: '板材品牌', cabinetMaterial: '柜体材质', doorMaterial: '门板材质' };
    toast('已把' + (names[f] || '该项') + '同步到 ' + picked.targets.length + ' 个柜体' +
      (picked.skipped ? '（' + picked.skipped + ' 个已单独设置，未改动）' : ''));
  }

  /* 强制把统一设置的当前值套到全部柜体（含单独改过的） */
  function forceGlobalAll() {
    if (!draft || !draft.cabinets.length) return;
    if (!confirm('会把统一设置里的品牌 / 材质 / 五金 / 单价套到全部 ' + draft.cabinets.length + ' 个柜体（含单独改过的），确定？')) return;
    const bar = document.querySelector('.cab-global');
    if (!bar) return;
    const get = k => {
      const e = bar.querySelector('[data-gcf="' + k + '"]');
      return e ? e.value : '';
    };
    const b = get('brand'), cm = get('cabinetMaterial'), dm = get('doorMaterial'), hw = get('hardwareName'), pr = get('priceInput');
    const cus = k => {
      const e = bar.querySelector('[data-gcfcustom="' + k + '"]');
      return e ? String(e.value || '').trim() : '';
    };
    const bCus = cus('brand'), cmCus = cus('cabinetMaterial'), dmCus = cus('doorMaterial');
    if (!globalCab) globalCab = {};
    draft.cabinets.forEach(c => {
      if (b && b !== '__mixed__') { c.brand = b; c.brandCustom = (b === OPT_CUSTOM) ? bCus : ''; }
      if (cm && cm !== '__mixed__') { c.cabinetMaterial = cm; c.cabinetMaterialCustom = (cm === OPT_CUSTOM) ? cmCus : ''; }
      if (dm && dm !== '__mixed__') { c.doorMaterial = dm; c.doorMaterialCustom = (dm === OPT_CUSTOM) ? dmCus : ''; }
      if (hw && hw !== '__mixed__') {
        const nm = hw === '__none__' ? '' : hw;
        c.hardwareName = nm;
        const preset = (DB.config.hardwareUpgrades || []).find(u => u.name === nm);
        if (preset) c.hardwarePrice = (preset.price === '' || preset.price === null) ? '' : String(preset.price);
      }
      applyAutoPrice(c);
      if (pr !== '' && pr !== null && pr !== undefined && resolveBackendPrice(c) === null) {
        const r = evalNum(pr);
        if (r !== null) c.priceInput = r;
      }
    });
    globalCab = {
      brand: b, cabinetMaterial: cm, doorMaterial: dm,
      brandCustom: bCus, cabinetMaterialCustom: cmCus, doorMaterialCustom: dmCus,
      hardwareName: hw === '__none__' ? '' : hw, priceInput: pr
    };
    render();
    toast('已强制统一全部 ' + draft.cabinets.length + ' 个柜体');
  }

  /* 统一设置里填的自定义名称：套到所有「其他（自定义）」的柜体 */
  function handleGlobalCustomName(el) {
    const f = el.dataset.gcfcustom;
    const name = String(el.value || '').trim();
    if (!draft || !f) return;
    if (!globalCab) globalCab = {};
    globalCab[f + 'Custom'] = name;
    let n = 0;
    draft.cabinets.forEach(c => {
      if (String(c[f] || '') === OPT_CUSTOM) {
        c[f + 'Custom'] = name;
        applyAutoPrice(c);
        n++;
      }
    });
    render();
    toast(name ? ('自定义名称「' + name + '」已套到 ' + n + ' 个柜体') : '已清空自定义名称');
  }

  function handleCabField(el, rerender) {
    const cab = currentCab(el);
    if (!cab) return false;
    const f = el.dataset.cf;
    if (!f) return false;

    let v;
    if (el.type === 'checkbox') v = el.checked;
    else {
      v = readNum(el);
      if (v === null) return false;
    }

    setPath(cab, f, v);

    /* 单独改了品牌 / 材质 / 五金 / 单价 → 这个柜体不再跟随整单 */
    const planFields = ['brand', 'brandCustom', 'cabinetMaterial', 'cabinetMaterialCustom',
      'doorMaterial', 'doorMaterialCustom', 'hardwareName', 'hardwarePrice', 'priceInput'];
    if (planFields.indexOf(f) >= 0) cab.follow = false;

    /* 手动改单价：标记为手改，覆盖后台价 */
    if (f === 'priceInput') {
      cab.priceManual = true;
      const backendP = resolveBackendPrice(cab);
      if (backendP !== null && Math.abs(num(v) - backendP) < 0.005) cab.priceManual = false;
    }

    if (f === 'type') {
      const sd = standardDepthOf(v);
      if (sd > 0) cab.depth = String(sd);
    }

    /* 五金名称命中预设方案时，自动带出对应加价（之后仍可手改） */
    if (f === 'hardwareName') {
      const u = (DB.config.hardwareUpgrades || []).find(x => x.name === v);
      if (u) {
        cab.hardwarePrice = u.price === '' || u.price === null ? '' : String(u.price);
        const priceEl = el.parentElement.querySelector('[data-cf="hardwarePrice"]');
        if (priceEl) priceEl.value = cab.hardwarePrice;
      }
    }

    const affectsPrice = ['brand', 'cabinetMaterial', 'doorMaterial', 'brandCustom', 'cabinetMaterialCustom', 'doorMaterialCustom', 'calcMode'].indexOf(f) >= 0;
    const affectsLayout = (f === 'calcMode');

    if (affectsPrice) {
      const matched = applyAutoPrice(cab);
      if (matched) { if (rerender) { render(); return true; } const card = el.closest('[data-cab]'); if (card) refreshPriceField(card, cab); }
      else if (rerender) { render(); return true; }
    }

    if (rerender) { render(); return true; }
    if (affectsLayout) { render(); return true; }
    updateSummary();
    return true;
  }

  function handleAddonDisc(el, kind) {
    const cab = currentCab(el);
    if (!cab) return;
    const id = kind === 'free' ? el.dataset.cfree : el.dataset.camt;
    if (!cab.addonDiscounts) cab.addonDiscounts = {};
    const cur = cab.addonDiscounts[id] || {};
    if (kind === 'free') {
      cur.free = el.checked;
      const wrap = el.closest('.addon-disc');
      const amt = wrap ? wrap.querySelector('[data-camt]') : null;
      if (amt) amt.disabled = el.checked;
    } else {
      const r = readNum(el);
      if (r === null) return;
      cur.amount = r;
    }
    cab.addonDiscounts[id] = cur;
    updateSummary();
  }

  function handleCustomAddon(el, field) {
    const cab = currentCab(el);
    if (!cab) return;
    const id = el.dataset[field];
    if (!Array.isArray(cab.customAddons)) cab.customAddons = [];
    const item = cab.customAddons.find(x => x.id === id);
    if (!item) return;
    if (field === 'caddname') item.name = el.value;
    else if (field === 'caddspec') item.spec = el.value;
    else if (field === 'caddunit') item.unit = el.value;
    else {
      const r = readNum(el);
      if (r === null) return;
      if (field === 'caddprice') item.price = r;
      else item.qty = r;
    }
    updateSummary();
  }

  function handleCabAddon(el, checked) {
    const cab = currentCab(el);
    if (!cab) return;
    const id = el.dataset.caddon;
    if (checked) cab.addons[id] = num(cab.addons[id]) > 0 ? num(cab.addons[id]) : 1;
    else delete cab.addons[id];

    const row = el.closest('.addon-row');
    const q = row ? row.querySelector('[data-caddonqty="' + id + '"]') : null;
    if (q) { q.disabled = !checked; if (checked) q.value = cab.addons[id]; }
    if (row) row.classList.toggle('checked', checked);

    const list = el.closest('.addon-list');
    const discRow = list ? list.querySelector('[data-discrow="' + id + '"]') : null;
    if (discRow) discRow.style.display = checked ? '' : 'none';

    updateSummary();
  }

  function onViewInput(e) {
    const el = e.target;

    if (el.dataset.cf) { handleCabField(el, false); return; }

    if (el.dataset.caddonqty !== undefined) {
      const cab = currentCab(el);
      if (cab) {
        const r = readNum(el);
        if (r !== null) { cab.addons[el.dataset.caddonqty] = r; updateSummary(); }
      }
      return;
    }
    if (el.dataset.camt !== undefined) { handleAddonDisc(el, 'amt'); return; }
    if (el.dataset.caddonprice !== undefined) {
      const cab = currentCab(el);
      if (cab) {
        if (!cab.addonPrices) cab.addonPrices = {};
        const r = readNum(el);
        if (r !== null) cab.addonPrices[el.dataset.caddonprice] = r;
        updateSummary();
      }
      return;
    }
    if (el.dataset.caddname !== undefined) { handleCustomAddon(el, 'caddname'); return; }
    if (el.dataset.caddspec !== undefined) { handleCustomAddon(el, 'caddspec'); return; }
    if (el.dataset.caddunit !== undefined) { handleCustomAddon(el, 'caddunit'); return; }
    if (el.dataset.caddprice !== undefined) { handleCustomAddon(el, 'caddprice'); return; }
    if (el.dataset.caddqty !== undefined) { handleCustomAddon(el, 'caddqty'); return; }
    if (el.dataset.aspec !== undefined) {
      const cab = currentCab(el);
      if (cab) {
        if (!cab.addonSpecs) cab.addonSpecs = {};
        cab.addonSpecs[el.dataset.aspec] = el.value;
        updateSummary();
      }
      return;
    }
    if (el.dataset.efname !== undefined) {
      const f = (draft.extraFees || []).find(x => x.id === el.dataset.efname);
      if (f) f.name = el.value;
      return;
    }
    if (el.dataset.efamt !== undefined) {
      const f = (draft.extraFees || []).find(x => x.id === el.dataset.efamt);
      if (f) {
        const r = readNum(el);
        if (r !== null) { f.amount = r; updateSummary(); }
      }
      return;
    }
    if (el.dataset.pf) {
      if (!PRESET) PRESET = presetNew();
      const i = Number(el.dataset.idx);
      const row = PRESET.rows[i];
      if (!row) return;
      const f = el.dataset.pf;
      row[f] = el.value;
      if (f === 'brand' || f === 'cabinetMaterial' || f === 'doorMaterial') {
        row.priceInput = presetAutoPrice(row);
        const inp = document.querySelector('[data-pf="priceInput"][data-idx="' + i + '"]');
        if (inp) inp.value = row.priceInput;
      }
      return;
    }
    if (el.dataset.pc) {
      if (!PRESET) PRESET = presetNew();
      PRESET.customer[el.dataset.pc] = el.value;
      return;
    }
    if (el.dataset.search !== undefined) {
      historyQuery = el.value;
      /* 只刷新表格，不重建输入框：否则中文输入法（拼音）会被打断，字打不进去 */
      if (!historyComposing) refreshHistoryList();
      return;
    }
    if (el.dataset.img) {
      const file = el.files && el.files[0];
      if (!file) return;
      if (file.size > 1024 * 1024) { toast('图片不要超过 1MB', true); el.value = ''; return; }
      const key = el.dataset.img;
      const reader = new FileReader();
      reader.onload = () => {
        setPath(DB, key, reader.result);
        queueDbSave();
        if (key === 'config.logo') applyLogo();
        if (tab === 'settings') $('#view').innerHTML = renderSettings();
        toast(key === 'config.logo' ? 'Logo 已更新' : '收款二维码已更新');
      };
      reader.readAsDataURL(file);
      return;
    }
    if (el.dataset.db) {
      const v = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value);
      const path = el.dataset.db;
      /* 材质改名：在第一次输入前记住原值（因为每敲一个字就已经写进 DB 了） */
      if (/^config\.(cabinetMaterials|doorMaterials)\.\d+$/.test(path) && el.dataset.orig === undefined) {
        const seg = path.split('.');
        el.dataset.orig = String(((DB.config[seg[1]] || [])[Number(seg[2])]) == null ? '' : (DB.config[seg[1]] || [])[Number(seg[2])]);
      }
      setPath(DB, path, v);
      if (path === 'config.storeName') $('#storeName').textContent = v;
      queueDbSave();
      /* 柜体类型的启用/关闭：勾选框，重建不影响输入 */
      if (/^config\.cabinetTypes\.\d+\.enabled$/.test(path)) {
        $('#view').innerHTML = renderSettings();
        toast(v ? '已启用该类型' : '已关闭该类型（开单时不再出现，已开的单不受影响）');
      }
      return;
    }
    if (el.dataset.terms !== undefined) {
      DB.config.terms = el.value.split('\n').map(s => s.trim()).filter(Boolean);
      queueDbSave();
      return;
    }
    if (el.dataset.bind) syncDraftFromInput(el);
  }

  function syncDraftFromInput(el) {
    const bind = el.dataset.bind;
    if (!bind) return;
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else {
      v = readNum(el);
      if (v === null) return;
    }
    setPath(draft, bind, v);

    if (bind === 'discount.type') {
      const vi = document.querySelector('[data-bind="discount.value"]');
      if (vi) {
        const off = (v === 'none' || v === 'free');
        vi.disabled = off;
        if (off) { draft.discount.value = 0; vi.value = 0; }
      }
    }
    updateSummary();
    scheduleDraftRecord();
  }

  function clampPayment() {
    const dep = Math.max(0, round2(num(draft.payment.depositAmount)));
    const ord = Math.min(Math.max(num(draft.payment.orderRatio), 0), 100);
    const tail = Math.min(Math.max(num(draft.payment.tailRatio), 0), 100);
    const cus = Math.max(0, round2(num(draft.payment.customOrderAmount)));
    draft.payment.depositAmount = dep;
    draft.payment.orderRatio = ord;
    draft.payment.tailRatio = tail;
    draft.payment.customOrderAmount = (draft.payment.customOrderAmount === '' ? '' : cus);
    const i1 = document.querySelector('[data-bind="payment.depositAmount"]');
    const i2 = document.querySelector('[data-bind="payment.orderRatio"]');
    const i3 = document.querySelector('[data-bind="payment.tailRatio"]');
    if (i1) i1.value = dep;
    if (i2) i2.value = ord;
    if (i3) i3.value = tail;
    updateSummary();
  }

  function onChange(e) {
    const el = e.target;

    if (el.dataset.roleuser) {
      const nm = el.dataset.name || '';
      const role = el.value;
      apiPost('/api/users', { action: 'setrole', id: el.dataset.roleuser, role: role })
        .then(() => Promise.all([loadUsers(), loadLogs()]))
        .then(() => { $('#view').innerHTML = renderSettings(); toast('「' + nm + '」已设为' + (role === 'admin' ? '管理员' : '普通账号')); })
        .catch(e => { toast(e.message, true); $('#view').innerHTML = renderSettings(); });
      return;
    }
    if (el.dataset.howner) {
      histOwnerFilter = el.value || '';
      refreshHistoryList();
      return;
    }
    if (el.dataset.costother) {
      const q = (DB.quotations || []).find(x => x.id === el.dataset.costother);
      if (q) {
        q.otherCost = el.value === '' ? '' : Number(el.value);
        q.updatedAt = q.updatedAt || new Date().toISOString();
        queueDbSave();
        $('#view').innerHTML = renderCost();
        toast('其他成本已更新');
      }
      return;
    }
    if (el.dataset.gcfcustom) { handleGlobalCustomName(el); return; }
    if (el.dataset.gcf) { handleGlobalCabField(el); return; }
    if (el.dataset.cf) {
      handleCabField(el, el.tagName === 'SELECT' || el.type === 'checkbox');
      normalizeNumField(el);
      return;
    }
    if (el.dataset.caddon !== undefined) { handleCabAddon(el, el.checked); return; }
    if (el.dataset.cfree !== undefined) { handleAddonDisc(el, 'free'); return; }
    if (el.dataset.caddonqty !== undefined || el.dataset.caddonprice !== undefined || el.dataset.camt !== undefined ||
        el.dataset.caddprice !== undefined || el.dataset.caddqty !== undefined) {
      onViewInput(e);
      normalizeNumField(el);
      return;
    }
    if (el.dataset.bind || el.dataset.db || el.dataset.terms !== undefined) {
      /* 材料改名：先记住旧名字，写入新值后再把价格表/单据里的旧名一起换掉。
         注意只在这里（change / 失焦）做，不能在 input 里做，否则每打一个字就重建输入框导致打不了字 */
      const dbPath = el.dataset.db || '';
      const mm = dbPath.match(/^config\.(cabinetMaterials|doorMaterials)\.(\d+)$/);
      const oldName = el.dataset.orig !== undefined ? el.dataset.orig : null;
      onViewInput(e);
      normalizeNumField(el);
      if (mm && oldName && oldName !== el.value) {
        const field = mm[1] === 'cabinetMaterials' ? 'cabinetMaterial' : 'doorMaterial';
        const n = propagateValue(field, oldName, el.value);
        if (n > 0) toast('已同步更新 ' + n + ' 处引用');
        if (tab === 'settings') $('#view').innerHTML = renderSettings();
      }
      if (el.dataset.bind && el.dataset.bind.indexOf('payment.') === 0) clampPayment();
      return;
    }
    if (el.id === 'importFile') {
      const f = el.files && el.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || !Array.isArray(data.quotations)) throw new Error('文件格式不正确');
          DB = data;
          ensureDefaults();
          await putDb();
          toast('备份已导入');
          render();
        } catch (err) {
          toast('导入失败：' + err.message, true);
        }
        el.value = '';
      };
      reader.readAsText(f, 'utf-8');
    }
  }

  function listTarget(act, path) {
    const map = {
      'config.spaces': DB.config.spaces,
      'config.cabinetNames': DB.config.cabinetNames,
      'config.cabinetMaterials': DB.config.cabinetMaterials,
      'config.doorMaterials': DB.config.doorMaterials
    };
    if (map[path]) return map[path];
    /* 兜底：按路径从 DB 里取数组，避免以后加新选项又忘了登记 */
    let obj = DB;
    const seg = String(path || '').split('.');
    for (let i = 0; i < seg.length; i++) {
      if (!obj) return null;
      obj = obj[seg[i]];
    }
    return Array.isArray(obj) ? obj : null;
  }

  function onViewClick(e) {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    const id = t.dataset.id;

    switch (act) {
      case 'sameAsPrev': {
        const idx = draft.cabinets.findIndex(c => c.id === id);
        if (idx <= 0) break;
        const prev = draft.cabinets[idx - 1];
        const cur = draft.cabinets[idx];
        ['brand', 'cabinetMaterial', 'doorMaterial'].forEach(f => {
          cur[f] = prev[f];
          cur[f + 'Custom'] = prev[f + 'Custom'];
        });
        /* 单价也一并带过来；只有计价方式不同或上一柜没填单价时才重新匹配后台价 */
        const sameMode = (cur.calcMode === prev.calcMode);
        if (sameMode && String(prev.priceInput == null ? '' : prev.priceInput).trim() !== '') {
          cur.priceInput = prev.priceInput;
        } else {
          applyAutoPrice(cur);
        }
        render();
        toast('已套用上一柜的品牌 / 材质 / 单价');
        break;
      }
      case 'addCabType': {
        DB.config.cabinetTypes.push({ name: '新类型', standardDepth: 600, reminder: '', enabled: true });
        queueDbSave();
        $('#view').innerHTML = renderSettings();
        break;
      }
      case 'delCabType': {
        const i = Number(t.dataset.idx);
        if (!confirm('确定删除柜体类型「' + ((DB.config.cabinetTypes[i] || {}).name || '') + '」？')) break;
        DB.config.cabinetTypes.splice(i, 1);
        queueDbSave();
        $('#view').innerHTML = renderSettings();
        break;
      }
      case 'addCab': {
        const cab = newCabinet();
        /* 新增的柜体自动沿用「统一设置」的配置，不用再回头一个个改 */
        ['brand', 'cabinetMaterial', 'doorMaterial'].forEach(f => {
          const v = globalCabValue(f);
          if (v) {
            cab[f] = v;
            const key = f + 'Custom';
            if (key in cab) {
              cab[key] = (v === OPT_CUSTOM && globalCab && globalCab[key]) ? globalCab[key] : '';
            }
          }
        });
        /* 五金：沿用统一设置的名称与加价 */
        const hwName = globalCabValue('hardwareName');
        if (hwName) {
          cab.hardwareName = hwName;
          const hwPreset = (DB.config.hardwareUpgrades || []).find(u => u.name === hwName);
          cab.hardwarePrice = hwPreset ? String(hwPreset.price || '') : '';
        }
        const okAuto = applyAutoPrice(cab);
        if (!okAuto) {
          const gp = globalCabValue('priceInput');
          if (gp !== '' && gp !== undefined && gp !== null) cab.priceInput = gp;
        }
        draft.cabinets.push(cab);
        render();
        break;
      }
      case 'addSameSpace': {
        const src = draft.cabinets.find(c => c.id === id);
        if (!src) break;
        const cb = newCabinet();
        /* 沿用空间 / 类型 / 计算方式 / 品牌材质 / 五金 / 单价，尺寸留空方便接着量 */
        ['space', 'type', 'calcMode', 'brand', 'brandCustom', 'cabinetMaterial', 'cabinetMaterialCustom',
         'doorMaterial', 'doorMaterialCustom', 'hardwareName', 'hardwarePrice', 'priceInput', 'film'].forEach(k => {
          if (src[k] !== undefined) cb[k] = src[k];
        });
        draft.cabinets.push(cb);
        render();
        toast('已按「' + (src.space || '本空间') + '」的配置新增一个柜体，接着填尺寸即可');
        break;
      }
      case 'toggleAddons': {
        openAddonCab = (openAddonCab === id) ? null : id;
        render();
        break;
      }
      case 'toggleSummary': {
        sumCollapsed = !sumCollapsed;
        render();
        break;
      }
      case 'dupCab': {
        const src = draft.cabinets.find(c => c.id === id);
        if (!src) break;
        const cp = clone(src); cp.id = uid('c');
        draft.cabinets.push(cp);
        render();
        toast('已复制该柜体');
        break;
      }
      case 'delCab': {
        if (draft.cabinets.length <= 1) { toast('至少保留一个柜体', true); break; }
        const cab = draft.cabinets.find(c => c.id === id);
        if (!confirm('确定删除「' + (cab ? cabLabel(cab) : '该柜体') + '」？')) break;
        draft.cabinets = draft.cabinets.filter(c => c.id !== id);
        render();
        break;
      }
      case 'addCustomAddon': {
        const target = draft.cabinets.find(c => c.id === t.dataset.cabid) || draft.cabinets[0];
        if (!target) break;
        if (!Array.isArray(target.customAddons)) target.customAddons = [];
        target.customAddons.push({ id: uid('ca'), name: '', spec: '', unit: '项', price: '', qty: '' });
        render();
        break;
      }
      case 'delCustomAddon': {
        draft.cabinets.forEach(c => {
          if (Array.isArray(c.customAddons)) c.customAddons = c.customAddons.filter(x => x.id !== id);
        });
        render();
        break;
      }
      case 'addEf': {
        if (!Array.isArray(draft.extraFees)) draft.extraFees = [];
        draft.extraFees.push({ id: uid('f'), name: '', amount: '' });
        render();
        break;
      }
      case 'delEf': {
        draft.extraFees = (draft.extraFees || []).filter(f => f.id !== id);
        render();
        break;
      }
      case 'save': saveQuotation(); break;
      case 'preview': previewCurrent(); break;
      case 'reset':
        if (confirm('确定清空当前报价并新建？未保存的内容将丢失。')) { draft = newDraft(); globalCab = null; render(); }
        break;
      case 'newQ': draft = newDraft(); globalCab = null; switchTab('booking'); render(); break;
      case 'openQ': {
        const q = DB.quotations.find(x => x.id === id);
        if (q) loadIntoDraft(q);
        break;
      }
      case 'copyQ': {
        const q = DB.quotations.find(x => x.id === id);
        if (!q) break;
        const cp = clone(q);
        cp.id = null; cp.quotationNo = ''; cp.status = 'draft'; cp.createdAt = null; cp.updatedAt = null;
        (cp.cabinets || []).forEach(c => { migrateCabinet(c); c.id = uid('c'); });
        draft = cp;
        switchTab('booking'); render();
        toast('已复制方案，修改后可另存为新报价');
        break;
      }
      case 'viewQ': {
        const q = DB.quotations.find(x => x.id === id);
        if (q) previewQuotation(q);
        break;
      }
      case 'voidQ': {
        const q = DB.quotations.find(x => x.id === id);
        if (!q) break;
        if (!confirm('确定将 ' + (q.quotationNo || '') + ' 标记为作废？')) break;
        q.status = q.status === 'void' ? 'quoted' : 'void';
        putDb().then(() => { $('#view').innerHTML = renderHistory(); toast('已更新'); });
        break;
      }
      case 'spaceCombo': {
        const inp = t.parentElement.querySelector('[data-cf="space"]');
        if (inp) openComboPop(inp, spaceOptionList());
        break;
      }
      case 'nameCombo': {
        const inp = t.parentElement.querySelector('[data-cf="name"]');
        if (inp) openComboPop(inp, cabNameOptionList(), { filter: true });
        break;
      }
      case 'hwCombo': {
        const inp = t.parentElement.querySelector('[data-cf="hardwareName"]');
        if (inp) openComboPop(inp, hwOptionList());
        break;
      }
      case 'compare': openCompare(id); break;
      case 'padd': {
        if (!PRESET) PRESET = presetNew();
        PRESET.rows.push(presetRow());
        $('#view').innerHTML = renderPreset();
        break;
      }
      case 'pdel': {
        if (!PRESET) break;
        PRESET.rows.splice(Number(t.dataset.idx), 1);
        if (!PRESET.rows.length) PRESET.rows.push(presetRow());
        $('#view').innerHTML = renderPreset();
        break;
      }
      case 'preset': {
        const act = t.dataset.preset;
        if (act === 'clear') { PRESET = presetNew(); $('#view').innerHTML = renderPreset(); break; }
        if (act === 'save') presetSave();
        break;
      }
      case 'assign': openAssign(); break;
      case 'followPlan': {
        const cab = draft.cabinets.find(c => c.id === id);
        if (!cab) break;
        cab.follow = true;
        /* 用统一设置里的当前值覆盖 */
        ['brand', 'brandCustom', 'cabinetMaterial', 'cabinetMaterialCustom', 'doorMaterial', 'doorMaterialCustom',
         'hardwareName', 'hardwarePrice', 'priceInput'].forEach(f => {
          if (globalCab && globalCab[f] !== undefined && globalCab[f] !== null && globalCab[f] !== '') cab[f] = globalCab[f];
        });
        cab.priceManual = false;
        applyAutoPrice(cab);
        render();
        toast('已恢复跟随整单');
        break;
      }
      case 'logout': doLogout(); break;
      case 'changePw': {
        const o = ($('#pwOld') || {}).value || '';
        const a = ($('#pwNew') || {}).value || '';
        const b = ($('#pwNew2') || {}).value || '';
        if (!o) { toast('请填写原密码', true); break; }
        if (a.length < 6) { toast('新密码至少 6 位', true); break; }
        if (a !== b) { toast('两次输入的新密码不一致', true); break; }
        apiPost('/api/password', { oldPassword: o, newPassword: a })
          .then(() => {
            toast('密码已修改');
            if (ME) ME.mustChange = false;
            const bar = $('#mustChangeBar');
            if (bar) bar.classList.add('hidden');
            $('#view').innerHTML = renderSettings();
          })
          .catch(e => toast(e.message, true));
        break;
      }
      case 'addUser': {
        const nm = ($('#newUserName') || {}).value || '';
        const pw = ($('#newUserPw') || {}).value || '';
        const role = ($('#newUserRole') || {}).value || 'user';
        if (nm.trim().length < 2) { toast('用户名至少 2 个字符', true); break; }
        if (pw.length < 6) { toast('密码至少 6 位', true); break; }
        apiPost('/api/users', { action: 'add', username: nm.trim(), password: pw, role: role })
          .then(() => loadUsers())
          .then(() => { $('#view').innerHTML = renderSettings(); toast('账号已添加'); })
          .catch(e => toast(e.message, true));
        break;
      }
      case 'resetUser': {
        const nm = t.dataset.name || '';
        const pw = prompt('给「' + nm + '」设置新密码（至少 6 位）：');
        if (pw === null) break;
        if (String(pw).length < 6) { toast('密码至少 6 位', true); break; }
        apiPost('/api/users', { action: 'reset', id: t.dataset.id, password: pw })
          .then(() => { toast('已重置「' + nm + '」的密码'); })
          .catch(e => toast(e.message, true));
        break;
      }
      case 'delUser': {
        const nm = t.dataset.name || '';
        if (!confirm('确定删除账号「' + nm + '」？删除后无法登录。')) break;
        apiPost('/api/users', { action: 'delete', id: t.dataset.id })
          .then(() => loadUsers())
          .then(() => { $('#view').innerHTML = renderSettings(); toast('账号已删除'); })
          .catch(e => toast(e.message, true));
        break;
      }
      case 'disableUser': {
        const nm = t.dataset.name || '';
        if (!confirm('停用账号「' + nm + '」？停用后对方立即掉线，且无法登录。')) break;
        apiPost('/api/users', { action: 'disable', id: t.dataset.id })
          .then(() => Promise.all([loadUsers(), loadLogs()]))
          .then(() => { $('#view').innerHTML = renderSettings(); toast('已停用「' + nm + '」，对方已掉线'); })
          .catch(e => toast(e.message, true));
        break;
      }
      case 'enableUser': {
        const nm = t.dataset.name || '';
        apiPost('/api/users', { action: 'enable', id: t.dataset.id })
          .then(() => Promise.all([loadUsers(), loadLogs()]))
          .then(() => { $('#view').innerHTML = renderSettings(); toast('已启用「' + nm + '」'); })
          .catch(e => toast(e.message, true));
        break;
      }
      case 'kickUser': {
        const nm = t.dataset.name || '';
        if (!confirm('把「' + nm + '」强制下线？对方需要重新登录。')) break;
        apiPost('/api/users', { action: 'kick', id: t.dataset.id })
          .then(() => loadLogs())
          .then(() => toast('已强制「' + nm + '」下线'))
          .catch(e => toast(e.message, true));
        break;
      }
      case 'refreshLogs': {
        loadLogs().then(() => { if (tab === 'settings') $('#view').innerHTML = renderSettings(); toast('日志已刷新'); });
        break;
      }
      case 'forceGlobalAll': forceGlobalAll(); break;
      case 'renameBrand': {
        const fromEl = document.querySelector('[data-brandrename="from"]');
        const toEl = document.querySelector('[data-brandrename="to"]');
        const from = fromEl ? fromEl.value : '';
        const to = toEl ? String(toEl.value || '').trim() : '';
        if (!from) { toast('请选择要改的品牌', true); break; }
        if (!to) { toast('请填写新品牌名', true); break; }
        if (to === from) { toast('新名称和原名称一样', true); break; }
        if (allBrandNames().indexOf(to) >= 0) { toast('已经有同名品牌了', true); break; }
        const n = propagateValue('brand', from, to);
        putDb().then(() => {
          $('#view').innerHTML = renderSettings();
          toast('已把「' + from + '」改成「' + to + '」，共更新 ' + n + ' 处');
        });
        break;
      }
      case 'clearImg': {
        const key = t.dataset.key;
        if (!key) break;
        setPath(DB, key, '');
        queueDbSave();
        if (key === 'config.logo') applyLogo();
        $('#view').innerHTML = renderSettings();
        toast('已清除');
        break;
      }
      case 'delQ': {
        const q = DB.quotations.find(x => x.id === id);
        if (!q) break;
        pendingDeleteId = id;
        const label = (q.quotationNo || '（未编号草稿）') +
          ((q.customer && (q.customer.name || q.customer.address)) ? ' · ' + [q.customer.name, q.customer.address].filter(Boolean).join(' / ') : '');
        openModal('删除报价记录',
          '<div class="pw-box">' +
            '<p class="pw-tip">即将删除：<strong>' + esc(label) + '</strong></p>' +
            '<p class="pw-warn">删除后无法恢复，请确认。</p>' +
            '<div class="field"><label>删除密码</label>' +
              '<input type="password" id="delPw" autocomplete="new-password" placeholder="请输入删除密码" autofocus></div>' +
            '<div class="pw-actions">' +
              '<button type="button" class="btn" data-act="closeModal">取消</button>' +
              '<button type="button" class="btn danger" data-act="confirmDelQ">确认删除</button>' +
            '</div>' +
          '</div>', true);
        const pw = $('#delPw');
        if (pw) { pw.focus(); pw.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); onViewClick({ target: { dataset: { act: 'confirmDelQ' } } }); } }); }
        break;
      }
      case 'confirmDelQ': {
        const pwEl = $('#delPw');
        const pw = pwEl ? pwEl.value : '';
        const expect = String(DB.config.deletePassword || '123456');
        if (pw !== expect) {
          toast('删除密码不正确', true);
          if (pwEl) { pwEl.value = ''; pwEl.focus(); }
          break;
        }
        const idx = DB.quotations.findIndex(x => x.id === pendingDeleteId);
        if (idx < 0) { closeModal(); break; }
        const wasCurrent = draft && draft.id === pendingDeleteId;
        DB.quotations.splice(idx, 1);
        pendingDeleteId = null;
        closeModal();
        if (wasCurrent) { draft = newDraft(); switchTab('history'); }
        putDb().then(() => {
          toast('报价记录已删除');
          $('#view').innerHTML = (tab === 'history') ? renderHistory() : renderBooking();
        });
        break;
      }
      case 'addOpt': {
        const arr = listTarget(act, t.dataset.path);
        if (!arr) break;
        arr.push('新选项');
        queueDbSave();
        $('#view').innerHTML = renderSettings();
        break;
      }
      case 'delOpt': {
        const arr = listTarget(act, t.dataset.path);
        if (!arr) break;
        const i = Number(t.dataset.idx);
        if (!confirm('确定删除选项「' + arr[i] + '」？')) break;
        arr.splice(i, 1);
        queueDbSave();
        $('#view').innerHTML = renderSettings();
        break;
      }
      case 'addRule': {
        DB.priceRules = DB.priceRules || [];
        DB.priceRules.push({ id: uid('p'), brand: '', cabinetMaterial: '', doorMaterial: '', priceSqm: '', priceM: '' });
        queueDbSave();
        $('#view').innerHTML = renderSettings();
        break;
      }
      case 'delRule': {
        const i = Number(t.dataset.idx);
        if (!confirm('确定删除这条价格组合？')) break;
        DB.priceRules.splice(i, 1);
        queueDbSave();
        $('#view').innerHTML = renderSettings();
        break;
      }
      case 'addAddon': {
        DB.addons.push({ id: uid('a'), group: '五金与收纳', name: '新增项', unit: '个', price: 0 });
        queueDbSave();
        $('#view').innerHTML = renderSettings();
        break;
      }
      case 'delAddon': {
        const i = Number(t.dataset.idx);
        if (!confirm('确定删除增项「' + (DB.addons[i] && DB.addons[i].name) + '」？')) break;
        DB.addons.splice(i, 1);
        queueDbSave();
        $('#view').innerHTML = renderSettings();
        break;
      }
      case 'exportBackup': exportBackup(); break;
      case 'importBackup': $('#importFile').click(); break;
      case 'setLayout': {
        const layout = t.dataset.layout === 'merged' ? 'merged' : 'split';
        DB.config.sheetLayout = layout;
        queueDbSave();
        syncLayoutSeg();
        if (previewQ) openModal($('#modalTitle').textContent, buildSheet(previewQ, calc(previewQ)));
        break;
      }
      case 'closeModal': closeModal(); break;
      case 'downloadPdf': {
        const sheetEl = document.querySelector('#modalBody .sheet');
        if (!sheetEl) { toast('请先打开报价单预览', true); break; }
        const cust = (previewQ && previewQ.customer && previewQ.customer.name) ? previewQ.customer.name : '';
        const no = (previewQ && previewQ.quotationNo) ? previewQ.quotationNo : '未保存';
        const addr = String((previewQ && previewQ.customer && previewQ.customer.address) || '').trim();
        /* 文件名优先用安装地址，其次客户名，最后编号 */
        const fname = addr ? ('报价单-' + addr.slice(0, 40))
          : ('报价单-' + (cust || no));
        const old = t.textContent;
        t.disabled = true; t.textContent = '生成中…';
        fetch('/api/pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ html: sheetEl.outerHTML, filename: fname, title: fname })
        }).then(async r => {
          if (!r.ok) {
            const j = await r.json().catch(() => ({ error: '生成失败' }));
            throw new Error(j.error || '生成失败');
          }
          return r.blob();
        }).then(blob => {
          const a = document.createElement('a');
          const url = URL.createObjectURL(blob);
          a.href = url;
          a.download = fname + '.pdf';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          toast('PDF 已下载：' + fname + '.pdf');
        }).catch(err => {
          toast(err.message + '，可改用「打印 / 另存为 PDF」', true);
        }).then(() => {
          t.disabled = false; t.textContent = old;
        });
        break;
      }
      case 'print': window.print(); break;
    }
  }

  /* ================= 备份 ================= */
  function exportBackup() {
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '衣柜报价系统备份-' + stamp() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('备份已导出');
  }

  /* ================= Tab ================= */
  function switchTab(name) {
    tab = name;
    $$('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    if (name === 'settings') {
      Promise.all([loadUsers(), loadLogs()]).then(() => { if (tab === 'settings') $('#view').innerHTML = renderSettings(); }).catch(() => {});
    }
    if (name === 'preset') {
      /* 预设页要选设计师，先把账号列表拉回来 */
      loadUsers().then(() => { if (tab === 'preset') $('#view').innerHTML = renderPreset(); }).catch(() => {});
    }
  }

  /* ================= 账号 ================= */
  let ME = null;
  let USERS = [];
  let LOGS = [];
  let histOwnerFilter = '';

  function isAdmin() { return !!ME && ['admin', 'owner', 'super'].indexOf(ME.role || '') >= 0; }

  function loadLogs() {
    if (!isAdmin()) return Promise.resolve();
    return fetch('/api/logs?limit=200', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : { logs: [] })
      .then(j => { LOGS = j.logs || []; })
      .catch(() => {});
  }

  function loadUsers() {
    return fetch('/api/users', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : { users: [] })
      .then(j => { USERS = j.users || []; });
  }

  function apiPost(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || '操作失败');
      return j;
    });
  }

  async function doLogout() {
    try { await apiPost('/api/logout', {}); } catch (e) { /* 忽略 */ }
    location.reload();
  }

              '<option value="designer"' + (u.role !== 'owner' ? ' selected' : '') + '>设计师</option>' +
              '<option value="owner"' + (u.role === 'owner' ? ' selected' : '') + '>主账号</option>' +
            '</select>'
          : (u.role === 'owner' ? '主账号' : '设计师')) + '</td>' +

                '<button class="btn small" data-act="resetUser" data-id="' + esc(u.id) + '" data-name="' + esc(u.username) + '">重置密码</button> ' +
                '<button class="btn small" data-act="kickUser" data-id="' + esc(u.id) + '" data-name="' + esc(u.username) + '">强制下线</button> ' +
                (off

                  : '<button class="btn small" data-act="disableUser" data-id="' + esc(u.id) + '" data-name="' + esc(u.username) + '">停用</button> ') +
                '<button class="btn small danger" data-act="delUser" data-id="' + esc(u.id) + '" data-name="' + esc(u.username) + '">删除</button>' +

    const pwBox = '<div class="acct-box">' +
      '<div class="acct-title">修改我的密码</div>' +
      '<div class="field"><label>原密码</label><input type="password" id="pwOld" autocomplete="current-password"></div>' +
      '<div class="field"><label>新密码（至少 6 位）</label><input type="password" id="pwNew" autocomplete="new-password"></div>' +
      '<div class="field"><label>确认新密码</label><input type="password" id="pwNew2" autocomplete="new-password"></div>' +
      '<button type="button" class="btn primary small" data-act="changePw">保存新密码</button>' +
      '<div class="hint" style="margin-top:8px">改完密码后，这个账号在其它设备上的登录会立即失效。</div>' +
    '</div>';

    const addBox = '<div class="acct-box">' +
      '<div class="acct-title">新增账号</div>' +
      '<div class="field"><label>用户名（至少 2 个字符）</label><input type="text" id="newUserName" autocomplete="off"></div>' +
      '<div class="field"><label>初始密码（至少 6 位）</label><input type="text" id="newUserPw" autocomplete="off"></div>' +
      '<div class="field"><label>角色</label><select id="newUserRole"><option value="designer">设计师</option></select></div>' +
      '<button type="button" class="btn small" data-act="addUser">添加账号</button>' +

      '<h2>账号安全 <span class="badge">当前：' + (ME ? esc(ME.username) : '-') + (isAdmin() ? ' · 管理员' : '') + '</span></h2>' +
      '<div class="acct-grid">' + pwBox + (amAdmin ? addBox : '') + '</div>' +

        ? '<div class="table-wrap" style="margin-top:14px"><table class="data">' +

          '<div class="hint" style="margin-top:8px">停用 / 重置密码 / 强制下线 都会让对方当前的登录立即失效，需要重新登录。' +

  /* ================= 按单预设价：把这张单指派给设计师填尺寸 ================= */
  function openAssign() {
    const old = document.querySelector('.asg-overlay');
    if (old) old.remove();
    const box = document.createElement('div');
    box.className = 'asg-overlay';
    box.innerHTML = '<div class="asg-card"><h3>指派给设计师填写尺寸</h3>' +
      '<p class="asg-tip">设计师登录后只会看到这张单，看不到价格表。他填完尺寸保存，系统按你预设的单价自动算好，状态变「已报价」，可以直接给客户看。</p>' +
      '<div class="asg-list" id="asgList">加载中…</div>' +
      '<div class="asg-acts"><button type="button" class="btn" data-asg-close="1">取消</button></div></div>';
    document.body.appendChild(box);

    fetch('/api/users', { cache: 'no-store' })
      .then(r => r.json())
      .then(j => {
        const list = (j.users || []).filter(u => u.role === 'designer' && !u.disabled);
        const el = box.querySelector('#asgList');
        el.innerHTML = list.length
          ? list.map(u => '<button type="button" class="asg-item" data-asg="' + esc(u.username) + '">' +
              esc(u.username) + '<small>' + esc(u.tenantName || '') + '</small></button>').join('')
          : '<div class="empty">这个门店还没有设计师账号，先去「商品库设置 → 账号安全」加一个</div>';
      })
      .catch(() => { box.querySelector('#asgList').innerHTML = '<div class="empty">读取账号失败</div>'; });

    box.addEventListener('click', e => {
      if (e.target === box || e.target.closest('[data-asg-close]')) { box.remove(); return; }
      const item = e.target.closest('[data-asg]');
      if (!item) return;
      const who = item.dataset.asg;
      draft.preset = true;
      draft.assignedTo = who;
      draft.status = 'preset';
      box.remove();
      doSaveQuotation(true);
      toast('已指派给「' + who + '」，他登录后就能填写尺寸');
      setTimeout(() => { if (tab === 'booking') render(); }, 600);
    });
  }

  /* ================= 比价：同一个柜体，不同品牌/材质的报价 ================= */
  function openCompare(cabId) {
    const cab = (draft.cabinets || []).find(c => c.id === cabId);
    if (!cab) return;
    const cur = calcCabinet(cab, DB.config);
    const curRule = findPriceRule(cab);
    const rules = (DB.priceRules || []).filter(r => num(r.priceSqm) > 0 || num(r.priceM) > 0);

    const seen = {};
    const rows = [];
    rules.forEach(r => {
      const key = [r.brand, r.cabinetMaterial, r.doorMaterial].join('|');
      if (seen[key]) return;
      seen[key] = 1;
      const probe = Object.assign({}, cab, {
        brand: r.brand, brandCustom: '',
        cabinetMaterial: r.cabinetMaterial, cabinetMaterialCustom: '',
        doorMaterial: r.doorMaterial, doorMaterialCustom: '',
        priceInput: '', priceManual: false
      });
      const cr = calcCabinet(probe, DB.config);
      if (!(cr.qty > 0) || !(cr.price > 0)) return;
      const isCur = curRule && curRule.id === r.id;
      rows.push({ rule: r, cr: cr, isCur: isCur, diff: round2(cr.subtotal - cur.subtotal) });
    });
    rows.sort((a, b) => a.cr.subtotal - b.cr.subtotal);

    const body = rows.map(x => {
      const cls = x.isCur ? ' class="cmp-cur"' : '';
      const diffTxt = x.diff === 0 ? '—'
        : (x.diff > 0 ? '<span class="cmp-up">+¥' + fmt(x.diff) + '</span>' : '<span class="cmp-down">-¥' + fmt(-x.diff) + '</span>');
      return '<tr' + cls + '>' +
        '<td>' + esc(x.rule.brand || '') + '</td>' +
        '<td>' + esc(x.rule.cabinetMaterial || '') + '</td>' +
        '<td>' + esc(x.rule.doorMaterial || '') + '</td>' +
        '<td class="num">' + fmt(x.cr.price) + '</td>' +
        '<td class="num" style="font-weight:600">¥' + fmt(x.cr.subtotal) + '</td>' +
        '<td class="num">' + diffTxt + '</td>' +
        '<td class="num">' + (x.isCur ? '当前' :
          '<button type="button" class="btn small primary" data-cmp-apply="' + esc([x.rule.brand, x.rule.cabinetMaterial, x.rule.doorMaterial].join('|')) + '">套用</button>') +
        '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="7"><div class="empty">没有可比较的价格组合</div></td></tr>';

    const old = document.querySelector('.cmp-overlay');
    if (old) old.remove();

    const box = document.createElement('div');
    box.className = 'cmp-overlay';
    box.innerHTML =
      '<div class="cmp-card">' +
        '<h3>比价 · ' + esc(cabLabel(cab)) + '</h3>' +
        '<p class="cmp-tip">按这个柜体的尺寸（' + (cur.qty > 0 ? fmtQty(cur.qty) + ' ' + cur.unit : '未填尺寸') + '）计算，' +
          '客户想升级材料时可以直接报这个价格。含该柜的增项与加价。</p>' +
        '<table class="cmp-table"><thead><tr>' +
          '<th>板材品牌</th><th>柜体材质</th><th>门板材质</th>' +
          '<th style="text-align:right">单价</th><th style="text-align:right">柜体合计</th>' +
          '<th style="text-align:right">较当前</th><th></th>' +
        '</tr></thead><tbody>' + body + '</tbody></table>' +
        '<div class="cmp-acts"><button type="button" class="btn" data-cmp-close="1">关闭</button></div>' +
      '</div>';
    document.body.appendChild(box);

    box.addEventListener('click', e => {
      if (e.target === box || e.target.closest('[data-cmp-close]')) { box.remove(); return; }
      const btn = e.target.closest('[data-cmp-apply]');
      if (!btn) return;
      const parts = btn.dataset.cmpApply.split('|');
      cab.brand = parts[0]; cab.brandCustom = '';
      cab.cabinetMaterial = parts[1]; cab.cabinetMaterialCustom = '';
      cab.doorMaterial = parts[2]; cab.doorMaterialCustom = '';
      cab.priceManual = false;
      cab.follow = false;
      applyAutoPrice(cab);
      box.remove();
      render();
      toast('已套用：' + parts.join(' + '));
    });
  }

  function bindGlobal() {
    $$('.tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.tab === 'booking' && !draft) draft = newDraft();
        switchTab(btn.dataset.tab);
        render();
      });
    });

    const view = $('#view');
    /* 顶栏「退出」按钮不在 #view 里，单独绑定 */
    const loBtn = $('#logoutBtn');
    if (loBtn) loBtn.addEventListener('click', doLogout);
    /* 下拉浮层：点外面 / 按 Esc / 滚动都收起 */
    document.addEventListener('mousedown', e => {
      if (!comboPop || comboPop.style.display === 'none') return;
      if (comboPop.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.combo-arrow')) return;
      closeComboPop();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeComboPop(); });
    /* 下拉打开时，边打字边筛选 */
    document.addEventListener('input', e => {
      if (comboPop && comboPop.style.display !== 'none' && comboPop._input === e.target) renderComboPop();
    });
    window.addEventListener('scroll', closeComboPop, true);
    window.addEventListener('resize', closeComboPop);
    view.addEventListener('input', onViewInput);
    view.addEventListener('change', onChange);
    view.addEventListener('click', onViewClick);
    /* 中文输入法拼字期间先不过滤，拼完再刷新，避免候选框被打断 */
    view.addEventListener('compositionstart', e => {
      if (e.target && e.target.dataset && e.target.dataset.search !== undefined) historyComposing = true;
    }, true);
    view.addEventListener('compositionend', e => {
      if (e.target && e.target.dataset && e.target.dataset.search !== undefined) {
        historyComposing = false;
        historyQuery = e.target.value;
        refreshHistoryList();
      }
    }, true);

    $('#modal').addEventListener('click', e => {
      if (e.target.closest('[data-act]')) onViewClick(e);
      if (e.target.id === 'modal') closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal();
    });

    window.addEventListener('beforeunload', e => {
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });
  }

  /* ================= 启动 ================= */
  async function init() {
    try {
      /* 未登录先去登录页 */
      const sres = await fetch('/api/session', { cache: 'no-store' });
      if (!sres.ok) { window.__showLogin && window.__showLogin(); return; }
      const sj = await sres.json();
      ME = sj.user || null;
      window.__CTX = sj.ctx || null;
      window.__TENANTS = sj.tenants || [];
      /* 总账号还没进门店 → 显示门店控制台 */
      if (sj.ctx && sj.ctx.role === 'super' && !sj.ctx.tenantId) {
        if (window.__renderSuperConsole) window.__renderSuperConsole();
        return;
      }
      document.body.classList.add('role-' + ((sj.ctx && sj.ctx.role) || 'designer'));
      if (sj.ctx && sj.ctx.canPrice === false) document.body.classList.add('is-designer');
      if (sj.ctx && sj.ctx.showPrice === false) document.body.classList.add('is-blind');
      if (ME) {
        const un = $('#userName');
        if (un) un.textContent = ME.username;
        if (ME.mustChange) {
          const bar = $('#mustChangeBar');
          if (bar) bar.classList.remove('hidden');
        }
        /* 「成本毛利」「预设报价」只给能定价的账号看（门店主账号 / 总账号） */
        if (sj.ctx && sj.ctx.canPrice) {
          const ct = $('#costTab');
          if (ct) ct.classList.remove('hidden');
          const pt = $('#presetTab');
          if (pt) pt.classList.remove('hidden');
        }
      }
      await loadDb();
      const changed = ensureDefaults();
      $('#storeName').textContent = DB.config.storeName;
      applyLogo();
      draft = newDraft();
      draft.cabinets.forEach(applyAutoPrice);
      bindGlobal();
      render();
      if (changed) { await putDb(); }
      setSaveState('已就绪');
    } catch (err) {
      $('#view').innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '<br>请确认已通过 启动.bat 打开本系统。</div>';
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>

<script>
(function () {
  var overlay = document.getElementById('loginOverlay');
  var form = document.getElementById('loginForm');
  var errEl = document.getElementById('loginErr');
  var btn = document.getElementById('loginBtn');

  window.__showLogin = function () {
    window.__authLost = false;
    overlay.classList.remove('hidden');
    setTimeout(function () { document.getElementById('username').focus(); }, 50);
  };

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errEl.textContent = '';
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    if (!username || !password) { errEl.textContent = '请输入账号和密码'; return; }
    btn.disabled = true; btn.textContent = '登录中…';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, body: j }; });
    }).then(function (res) {
      if (res.ok && res.body.ok) { location.reload(); return; }
      errEl.textContent = (res.body && res.body.error) || '登录失败';
      btn.disabled = false; btn.textContent = '登 录';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }).catch(function () {
      errEl.textContent = '连接服务器失败，请稍后重试';
      btn.disabled = false; btn.textContent = '登 录';
    });
  });
})();
</script>


<script>
/* ================= 多门店：总账号控制台 + 顶栏 ================= */
(function () {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
    function tip(msg, isErr) {
    var el = document.getElementById('tcTip');
    if (!el) { el = document.createElement('div'); el.id = 'tcTip'; el.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:' + (isErr ? '#b91c1c' : '#1f4e79') + ';color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.2)'; document.body.appendChild(el); }
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.style.display = 'none'; }, 2600);
  }

  function api(url, body) {
    return fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || '操作失败');
        return j;
      });
    });
  }

  /* ---------- 顶栏：门店 / 角色 / 返回总账号 ---------- */
  function decorateTopbar() {
    var ctx = window.__CTX || {};
    var right = document.querySelector('.topbar-right');
    if (!right || !ctx.role) return;
    var roleTxt = { super: '总账号', owner: '主账号', designer: '设计师' }[ctx.role] || ctx.role;

    if (ctx.tenantName) {
      var tb = document.createElement('span');
      tb.className = 'tenant-badge';
      tb.textContent = ctx.tenantName;
      right.insertBefore(tb, right.firstChild);
    }
    var rb = document.createElement('span');
    rb.className = 'role-badge';
    rb.textContent = roleTxt;
    right.insertBefore(rb, right.querySelector('#userName'));

    if (ctx.role === 'super' && ctx.tenantId) {
      var back = document.createElement('button');
      back.type = 'button';
      back.className = 'back-super-btn';
      back.textContent = '返回总账号';
      back.onclick = function () {
        back.disabled = true;
        api('/api/act', { tenantId: null }).then(function () { location.reload(); })
          .catch(function (e) { tip(e.message, true); back.disabled = false; });
      };
      right.insertBefore(back, right.querySelector('#logoutBtn'));
    }
  }

  /* ---------- 总账号：门店控制台 ---------- */
  window.__renderSuperConsole = function () {
    document.body.classList.add('is-super-root');
    var view = document.getElementById('view');
    if (!view) return;

    function draw() {
      fetch('/api/tenants', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var list = j.tenants || [];
          var items = list.map(function (t) {
            return '<div class="tc-item">' +
              '<h3>' + esc(t.name) + (t.disabled ? ' <span class="st-off">已停用</span>' : '') + '</h3>' +
              '<div class="tc-meta">' + t.users + ' 个账号 · ' + t.quotes + ' 张报价单</div>' +
              '<div class="tc-acts">' +
                '<button class="btn small primary" data-enter="' + esc(t.id) + '"' + (t.disabled ? ' disabled' : '') + '>进入门店</button>' +
                '<button class="btn small" data-toggle="' + esc(t.id) + '" data-off="' + (t.disabled ? '1' : '0') + '">' + (t.disabled ? '启用' : '停用') + '</button>' +
                '<button class="btn small danger" data-del="' + esc(t.id) + '" data-name="' + esc(t.name) + '">删除</button>' +
              '</div>' +
            '</div>';
          }).join('');

          view.innerHTML =
            '<div class="tc-wrap">' +
              '<section class="tc-card">' +
                '<h2>门店管理 <span class="badge">' + list.length + ' 个门店</span></h2>' +
                '<div class="tc-grid">' + (items || '<div class="tc-empty">还没有门店</div>') + '</div>' +
              '</section>' +
              '<section class="tc-card">' +
                '<h2>新建门店</h2>' +
                '<div class="tc-form">' +
                  '<div class="field"><label>门店名称</label><input id="tcName" placeholder="如：广州天河店"></div>' +
                  '<div class="field"><label>主账号用户名</label><input id="tcUser" placeholder="如：gztianhe"></div>' +
                  '<div class="field"><label>主账号初始密码（≥6 位）</label><input id="tcPw" placeholder="登录后可改"></div>' +
                  '<button class="btn primary" id="tcCreate">创建门店</button>' +
                '</div>' +
                '<div class="hint" style="margin-top:10px">创建后把「用户名 + 初始密码」发给店里的财务，他用主账号登录后可以自己加设计师账号。</div>' +
              '</section>' +
            '</div>';

          view.addEventListener('click', function (e) {
            var b = e.target.closest('button');
            if (!b) return;
            if (b.dataset.enter) {
              b.disabled = true;
              api('/api/act', { tenantId: b.dataset.enter }).then(function () { location.reload(); })
                .catch(function (err) { tip(err.message, true); b.disabled = false; });
            } else if (b.dataset.toggle) {
              b.disabled = true;
              api('/api/tenants', { action: b.dataset.off === '1' ? 'enable' : 'disable', id: b.dataset.toggle })
                .then(function () { location.reload(); })
                .catch(function (err) { tip(err.message, true); b.disabled = false; });
            } else if (b.dataset.del) {
              if (!b.dataset.confirm2) { b.dataset.confirm2='1'; b.textContent='再点一次确认'; setTimeout(function(){ if(b.dataset.confirm2){ b.dataset.confirm2=''; b.textContent='删除'; } }, 3000); return; }
              b.disabled = true;
              api('/api/tenants', { action: 'delete', id: b.dataset.del }).then(function () { location.reload(); })
                .catch(function (err) { tip(err.message, true); b.disabled = false; });
            } else if (b.id === 'tcCreate') {
              var name = (document.getElementById('tcName') || {}).value || '';
              var user = (document.getElementById('tcUser') || {}).value || '';
              var pw = (document.getElementById('tcPw') || {}).value || '';
              if (!name.trim()) { tip('请填门店名称', true); return; }
              if (user.trim().length < 2) { tip('主账号用户名至少 2 个字', true); return; }
              if (pw.length < 6) { tip('主账号密码至少 6 位', true); return; }
              b.disabled = true;
              api('/api/tenants', { action: 'create', name: name.trim(), ownerUsername: user.trim(), ownerPassword: pw })
                .then(function () { tip('门店已创建：' + name.trim()); setTimeout(function () { location.reload(); }, 700); })
                .catch(function (err) { tip(err.message, true); b.disabled = false; });
            }
          });
        })
        .catch(function (e) {
          view.innerHTML = '<div class="tc-wrap"><div class="tc-card">加载失败：' + esc(e.message) + '</div></div>';
        });
    }

    draw();
    var un = document.getElementById('userName');
    if (un && window.__CTX) un.textContent = '';
  };

  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(decorateTopbar, 400);
  });
})();
</script>
</body>
