  /* 品牌下拉的数据来源 = 价格组合表里出现过的品牌（去重、保持顺序） */
  function allBrandNames() {
    const out = [];
    (DB.priceRules || []).forEach(r => {
      const n = String(r.brand || '').trim();
      if (n && out.indexOf(n) < 0) out.push(n);
    });
    return out;
  }

  /* 顶部「统一设置」条：单独成函数，方便局部刷新 */
  function buildGlobalBar(d) {
    const gv = f => {
      const vals = d.cabinets.map(x => String(x[f] == null ? '' : x[f]));
      if (!vals.length) return '';
      return vals.every(v => v === vals[0]) ? vals[0] : null;
    };
    const gOpts = (arr, cur) =>
      (cur === null ? '<option value="__mixed__" selected>（多种）</option>' : '') +
      (arr || []).filter(Boolean).map(v =>
        '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>').join('') +
      '<option value="' + OPT_CUSTOM + '"' + (cur === OPT_CUSTOM ? ' selected' : '') + '>其他（自定义）</option>';

    const gBrand = gv('brand'), gCm = gv('cabinetMaterial'), gDm = gv('doorMaterial');

    const gHwVals = d.cabinets.map(x => hwOf(x).name);
    const gHw = (!gHwVals.length || !gHwVals.every(v => v === gHwVals[0])) ? null : (gHwVals[0] || '');
    const gHwOpts = (gHw === null ? '<option value="__mixed__" selected>（多种）</option>' : '') +
      ((gHw && (DB.config.hardwareUpgrades || []).every(u => u.name !== gHw))
        ? '<option value="' + esc(gHw) + '" selected>' + esc(gHw) + '（自定义）</option>' : '') +
      (DB.config.hardwareUpgrades || []).map(u =>
        '<option value="' + esc(u.name) + '"' + (u.name === gHw ? ' selected' : '') + '>' + esc(u.name) + '</option>').join('') +
      '<option value="__none__"' + (gHw === '' ? ' selected' : '') + '>不用五金升级</option>';

    const gPrices = d.cabinets.map(x => effectiveUnitPrice(x));
    const gPriceSame = (gPrices.length && gPrices.every(p => p === gPrices[0])) ? gPrices[0] : null;
    const gLocked = d.cabinets.length > 0 && d.cabinets.every(x => resolveBackendPrice(x) !== null);

    /* 选了「其他（自定义）」时，右边多给一个输入框填自定义名称 */
    const gCustom = f => {
      if (gv(f) !== OPT_CUSTOM) return '';
      const names = d.cabinets
        .filter(x => String(x[f] || '') === OPT_CUSTOM)
        .map(x => String(x[f + 'Custom'] || '').trim());
      const same = (names.length && names.every(v => v === names[0])) ? names[0] : '';
      return '<input class="g-custom" type="text" data-gcfcustom="' + f + '" value="' + esc(same) + '" placeholder="填自定义名称">';
    };

    return '<div class="cab-global" data-sig="' + esc([gBrand, gCm, gDm, gHw, gPriceSame].join('|')) + '">' +
      '<span class="g-title">统一设置</span>' +
      '<div class="g-item"><label>板材品牌</label><div class="g-row"><select data-gcf="brand">' + gOpts(allBrandNames(), gBrand) + '</select>' + gCustom('brand') + '</div></div>' +
      '<div class="g-item"><label>柜体材质</label><div class="g-row"><select data-gcf="cabinetMaterial">' + gOpts(DB.config.cabinetMaterials, gCm) + '</select>' + gCustom('cabinetMaterial') + '</div></div>' +
      '<div class="g-item"><label>门板材质</label><div class="g-row"><select data-gcf="doorMaterial">' + gOpts(DB.config.doorMaterials, gDm) + '</select>' + gCustom('doorMaterial') + '</div></div>' +
      '<div class="g-item"><label>五金</label><select data-gcf="hardwareName">' + gHwOpts + '</select></div>' +
      '<div class="g-item"><label>单价</label>' +
        '<input type="text" inputmode="decimal" data-num="1" data-gcf="priceInput" value="' + (gPriceSame !== null ? esc(gPriceSame) : '') + '"' +
        (gLocked ? ' readonly title="已匹配后台价格组合"' : ' placeholder="统一手填价"') + '></div>' +
      '<span class="g-hint">整单默认：' + followCount().on + ' 个柜体跟随' + (followCount().off ? '，' + followCount().off + ' 个已单独设置' : '') + '</span>' +
      '<button type="button" class="btn small g-force" data-act="forceGlobalAll" title="把当前统一值套到全部柜体，包括单独改过的">全部强制统一</button>' +
    '</div>';
  }

  /* 表格里改了值以后，让「统一设置」条跟着更新（避免显示过期的选择） */
  function refreshGlobalBar() {
    if (!draft) return;
    const bar = document.querySelector('.cab-global');
    if (!bar) return;
    const html = buildGlobalBar(draft);
    const m = html.match(/data-sig="([^"]*)"/);
    if (m && bar.dataset.sig === m[1]) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const fresh = tmp.firstElementChild;
    if (fresh) bar.replaceWith(fresh);
  }

  /* 表格行：一个柜体一行 */
  /* 增项小标签（开单页卡片下方 & 实时刷新都用它） */
  function addonChipsHtml(lines) {
    return (lines || []).map(l =>
      '<span class="ad-chip" title="' + esc(l.spec || '') + '">' +
        '<b>' + esc(l.name) + '</b>' +
        '<em>' + fmtQty(l.qty) + ' ' + esc(l.unit || '') + '</em>' +
        '<i>¥' + fmt(l.amount) + '</i>' +
        (l.discount > 0 ? '<u>' + (l.gross && l.amount === 0 ? '全免' : '优惠 -' + fmt(l.discount)) + '</u>' : '') +
      '</span>').join('');
  }

  /* 实时刷新某个柜体下方的增项标签 */
  function refreshAddonChips(cabId, cr) {
    const blk = document.querySelector('.cab-block[data-cab="' + cabId + '"]');
    if (!blk) return;
    const lines = (cr.lines || []).filter(l => l.kind === 'addon');
    let el = blk.querySelector('.cb-addons');
    if (!lines.length) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('div');
      el.className = 'cb-addons';
      el.setAttribute('data-act', 'toggleAddons');
      el.setAttribute('data-id', cabId);
      el.setAttribute('title', '点这里展开/收起增项明细');
      blk.appendChild(el);
    }
    const sum = round2(lines.reduce((s, l) => s + num(l.amount), 0));
    el.innerHTML = '<span class="ad-label">已选增项 ' + lines.length + ' 项</span>' +
      addonChipsHtml(lines) +
      '<span class="ad-sum">合计 ¥' + fmt(sum) + '</span>';
  }

        '<span class="cb-f cb-f-dim"><i>抽屉</i><input type="text" inputmode="decimal" data-num="1" data-cf="drawerQty" value="' + esc(cab.drawerQty) + '" title="每 ' + (num(DB.config.drawer.perSqmArea) || 2) + (isMeter ? ' 米' : '㎡') + ' 含 ' + (num(DB.config.drawer.perCount) || 1) + ' 个，超出按 ' + DB.config.drawer.extraPrice + ' 元/个"></span>' +
        '<span class="cb-f cb-f-dim"><i>五金加价/' + hwUnitTxt + '</i><input type="text" inputmode="decimal" data-num="1" data-cf="hardwarePrice" value="' + esc(hwInfo.price || '') + '" placeholder="0"></span>' +
        '<span class="cb-hint' + (dh.warn ? ' warn' : '') + '" id="cabhint-' + esc(cab.id) + '"' + (dh.warn ? ' title="' + esc(dh.text) + '"' : '') + '>' + (dh.warn ? '⚠ 超深 ' + round2(maxDepthOf(cab) - standardDepthOf(cab.type)) + ' mm' : '') + '</span>' +
        '<span class="cb-f cb-f-remark"><i>备注</i><input data-cf="remark" value="' + esc(cab.remark || '') + '" placeholder="这个柜子的特别说明，会打印在报价单上"></span>' +
        '<span class="cb-acts">' +
          '<button type="button" class="btn small addon-btn' + (isOpen ? ' primary' : '') + (addonCount ? ' on' : '') + '" data-act="toggleAddons" data-id="' + esc(cab.id) + '">' +
            '<span id="cabaddonbtn-' + esc(cab.id) + '">增项' + (addonCount ? ' ' + addonCount : '') + '</span></button>' +
          (window.__CTX && window.__CTX.canPrice
            ? '<button type="button" class="btn small" data-act="compare" data-id="' + esc(cab.id) + '" title="按这个柜体的尺寸，比较不同品牌 / 材质的报价">比价</button>'
            : '') +
          (cab.follow === false
            ? '<button type="button" class="btn small warn-btn" data-act="followPlan" data-id="' + esc(cab.id) + '" title="恢复成整单默认的品牌 / 材质 / 五金 / 单价">跟随整单</button>'
            : '') +
          '<button type="button" class="btn small" data-act="addSameSpace" data-id="' + esc(cab.id) + '" title="按这个柜体的空间 / 品牌 / 材质 / 单价，再加一个柜体（尺寸留空）">＋同空间</button>' +
          '<button type="button" class="btn small" data-act="sameAsPrev" data-id="' + esc(cab.id) + '"' +
            (idx === 0 ? ' disabled title="第一个柜体没有可套用对象"' : ' title="套用上一柜的品牌 / 材质 / 单价"') + '>同上</button>' +
          '<button type="button" class="btn small" data-act="dupCab" data-id="' + esc(cab.id) + '">复制</button>' +
          '<button type="button" class="btn small danger" data-act="delCab" data-id="' + esc(cab.id) + '">删</button>' +
        '</span>' +
      '</div>' +
      /* ---------- 已选增项：直接列出来，方便复查 ---------- */
      (addonCount
        ? '<div class="cb-addons" data-act="toggleAddons" data-id="' + esc(cab.id) + '" title="点这里展开/收起增项明细">' +
            '<span class="ad-label">已选增项 ' + addonCount + ' 项</span>' +
            addonChips +
            '<span class="ad-sum">合计 ¥' + fmt(addonSum) + '</span>' +
          '</div>'
        : '') +
    '</div>';
  }

  /* 展开的增项面板（含易漏提醒、肤感面开关、增项表） */
  function cabAddonPanel(cab, cr) {
    const cfg = DB.config;
    const isMeter = cab.calcMode === MODE_METER;
    const rem = typeReminder(cab);

    const groups = {};
    const order = [];
    (DB.addons || []).forEach(a => {
      if (!groups[a.group]) { groups[a.group] = []; order.push(a.group); }
      groups[a.group].push(a);
    });

    const addonHtml = order.map(g => {
      const rows = groups[g].map(a => {
        const qty = num((cab.addons || {})[a.id]);
        const d = (cab.addonDiscounts || {})[a.id] || {};
        const rowHtml = '<div class="addon-row' + (qty > 0 ? ' checked' : '') + '">' +
          '<input type="checkbox" class="cb" data-caddon="' + a.id + '"' + (qty > 0 ? ' checked' : '') + '>' +
          '<span class="an">' + esc(a.name) + '</span>' +
          '<input class="aspec" type="text" data-aspec="' + a.id + '" value="' + esc((cab.addonSpecs || {})[a.id] || '') + '" placeholder="规格(mm)">' +
          '<span class="au">' + esc(a.unit) + '</span>' +
          '<input class="apx" type="text" inputmode="decimal" data-num="1" data-caddonprice="' + a.id + '" value="' + esc(addonPrice(cab, a)) + '">' +
          '<input class="aq" type="text" inputmode="decimal" data-num="1" data-caddonqty="' + a.id + '" value="' + (qty > 0 ? qty : '') + '"' + (qty > 0 ? '' : ' disabled') + ' title="' + esc(addonUnitHint(a)) + '">' +
          '</div>';
        const discHtml = '<div class="addon-disc" data-discrow="' + a.id + '"' + (qty > 0 ? '' : ' style="display:none"') + '>' +
          '<label class="disc-free"><input type="checkbox" data-cfree="' + a.id + '"' + (d.free ? ' checked' : '') + '>全免</label>' +
          '<span>减额</span>' +
          '<input class="disc-amt" type="text" inputmode="decimal" data-num="1" data-camt="' + a.id + '" value="' + (num(d.amount) > 0 ? esc(d.amount) : '') + '"' + (d.free ? ' disabled' : '') + '>' +
          '<span>元</span></div>';
        return rowHtml + discHtml;
      }).join('');
      return '<details class="addon-group"><summary><span>' + esc(g) + '</span><span></span></summary>' +
        '<div class="addon-list">' + rows + '</div></details>';
    }).join('');

    return '<div class="cab-panel">' +
      (rem ? '<div class="cab-reminder">💡 <strong>易漏增项提醒</strong>（' + esc(cab.type) + '）：' + esc(rem) + '</div>' : '') +
      '<div class="panel-head">' +
        '<span class="hint">' + priceExplain(cab, cr) + '</span>' +
        (cfg.film && cfg.film.enabled
          ? '<label class="radio-card' + (cab.film ? ' active' : '') + '"><input type="checkbox" data-cf="film"' + (cab.film ? ' checked' : '') +
            '><span>海洋板肤感面 +' + cfg.film.price + ' 元/' + (isMeter ? '米' : '㎡') + '</span></label>'
          : '') +
      '</div>' +
      '<div class="addon-head"><span></span><span>项目</span><span>规格(mm)</span><span>单位</span><span>单价</span><span>数量</span></div>' +
      addonHtml +
      customAddonHtml(cab) +
    '</div>';
  }

  function priceExplain(cab, cr) {
    const rule = findPriceRule(cab);
    if (!rule) return '未在后台找到「' + esc(effName(cab, 'brand') || '?') + ' + ' + esc(effName(cab, 'cabinetMaterial') || '?') + ' + ' + esc(effName(cab, 'doorMaterial') || '?') + '」的价格组合，单价由你手动填写。';
    if (cab.calcMode === MODE_METER) {
      if (rule.priceM === null || rule.priceM === undefined || rule.priceM === '') {
        return '延米与投影同价，按 ' + rule.priceSqm + ' 元/米 计算。';
      }
      return '匹配后台延米单价 ' + rule.priceM + ' 元/米。';
    }
    return '匹配后台投影单价 ' + rule.priceSqm + ' 元/㎡。';
  }

  function areaText(cr) {
    if (!(cr.qty > 0)) return cr.mode === MODE_METER ? '填写长度后自动计算' : '填写宽度与高度后自动计算';
    if (cr.mode === MODE_METER) {
      let t = '计价长度 <strong>' + fmtQty(cr.qty) + ' 米</strong>';
      t += '<br>抽屉：已含 ' + cr.included + ' 个';
      if (cr.extra > 0) t += '，超出 ' + cr.extra + ' 个 × ' + DB.config.drawer.extraPrice + ' 元';
      return t;
    }
    let t = '投影面积 <strong>' + fmtQty(cr.qty) + ' ㎡</strong>（' + esc(cr.qtyNote) + '）';
    t += '<br>抽屉：已含 ' + cr.included + ' 个';
    if (cr.extra > 0) t += '，超出 ' + cr.extra + ' 个 × ' + DB.config.drawer.extraPrice + ' 元';
    return t;
  }

  function fieldText(label, bind, value, extraCls, type, step, hint, warn) {
    const cls = 'field' + (extraCls ? ' ' + extraCls : '');
    const t = type || 'text';
    const st = step ? ' step="' + step + '"' : '';
    const v = value === undefined || value === null ? '' : value;
    return '<div class="' + cls + '">' +
      '<label>' + esc(label) + '</label>' +
      '<input type="' + t + '" data-bind="' + bind + '" value="' + esc(v) + '"' + st + '>' +
      (hint ? '<span class="hint' + (warn ? ' warn' : '') + '">' + esc(hint) + '</span>' : '') +
      '</div>';
  }

  /* ================= 汇总 ================= */
  function updateSummary() {
    const el = $('#summaryCard');
    if (!el || !DB || !draft) return;
    const c = calc(draft);
    const d = draft;

    const cabList = c.cabinets.map(cr => {
      const cab = cr.cab;
      const label = cabLabel(cab);
      return '<div class="sum-line cab-line"><span class="sl-name">' + esc(label) + '</span>' +
        '<span class="sl-amt">¥' + fmt(cr.subtotal) + '</span></div>';
    }).join('');

    const linesEl = $('#sumLines');
    if (linesEl) linesEl.innerHTML = cabList || '<div class="hint">添加柜体后自动计算</div>';

    const totalsEl = $('#sumTotals');
    if (totalsEl) {
      const discHtml = c.addonDiscountTotal > 0
        ? '<div class="sum-line"><span class="sl-name">增项优惠</span><span class="sl-amt" style="color:#b91c1c">-¥' + fmt(c.addonDiscountTotal) + '</span></div>'
        : '';
      totalsEl.innerHTML =
        discHtml +
        '<div class="sum-total"><span class="label">合计金额</span><span class="value">¥' + fmt(c.finalTotal) + '</span></div>';
    }

    const payEl = $('#sumPay');
    if (payEl) {
      if (c.fullPay) {
        payEl.innerHTML =
          '<div class="pay-item" style="background:#eef9f0"><div class="pl">全款（一次付清）</div><div class="pv">¥' + fmt(c.deposit) + '</div><div class="pr">保底机制</div></div>' +
          '<div class="pay-item"><div class="pl">下单货款</div><div class="pv">¥0.00</div></div>' +
          '<div class="pay-item"><div class="pl">出货款</div><div class="pv">¥0.00</div></div>' +
          '<div class="pay-item"><div class="pl">尾款</div><div class="pv">¥0.00</div></div>';
      } else if (c.threeMode) {
        payEl.innerHTML =
          '<div class="pay-item"><div class="pl">定金（固定）</div><div class="pv">¥' + fmt(c.deposit) + '</div></div>' +
          '<div class="pay-item"><div class="pl">下单货款（自定义）</div><div class="pv">¥' + fmt(c.orderTotal) + '</div></div>' +
          '<div class="pay-item"><div class="pl">尾款（余额）</div><div class="pv">¥' + fmt(c.tailTotal) + '</div></div>' +
          '<div class="pay-item" style="background:#fffbf0"><div class="pl">参考 · 9 成货款</div><div class="pv" style="font-size:15px">¥' + fmt(c.nineTenths) + '</div></div>' +
          (c.depositOver > 0 ? '<div class="hint warn" style="grid-column:1/-1">⚠ 定金 ' + fmt(c.depositAmount) + ' 元超过合计金额，超出 ¥' + fmt(c.depositOver) + ' 未计入。</div>' : '');
      } else {
        payEl.innerHTML =
          '<div class="pay-item"><div class="pl">定金（固定）</div><div class="pv">¥' + fmt(c.deposit) + '</div></div>' +
          '<div class="pay-item"><div class="pl">下单货款 ' + c.orderEff + '%</div><div class="pv">¥' + fmt(c.orderTotal) + '</div></div>' +
          '<div class="pay-item"><div class="pl">出货款</div><div class="pv">¥' + fmt(c.shipTotal) + '</div><div class="pr">余额自动</div></div>' +
          '<div class="pay-item"><div class="pl">尾款 ' + c.tailEff + '%</div><div class="pv">¥' + fmt(c.tailTotal) + '</div></div>' +
          (c.depositOver > 0 ? '<div class="hint warn" style="grid-column:1/-1">⚠ 定金 ' + fmt(c.depositAmount) + ' 元超过合计金额，超出 ¥' + fmt(c.depositOver) + ' 未计入。</div>' : '') +
          (c.compressed ? '<div class="hint warn" style="grid-column:1/-1">⚠ 定金 + 下单货款 + 尾款 超过合计金额，已自动压缩为：下单 ' + c.orderEff + '%、尾款 ' + c.tailEff + '%。</div>' : '');
      }
    }

    /* 收款模式提示 + 输入框可用状态 */
    const modeHint = $('#payModeHint');
    if (modeHint) {
      if (c.fullPay) {
        modeHint.className = 'hint ok';
        modeHint.innerHTML = '合计 <strong>¥' + fmt(c.finalTotal) + '</strong> 低于保底线 <strong>¥' + fmt(c.fullPayThreshold) +
          '</strong>，按<strong>全款一次收取</strong>（定金 = 全款，不再分下单/出货/尾款，避免比例失控）。';
      } else if (c.threeMode) {
        modeHint.className = 'hint warn';
        modeHint.innerHTML = '定金 ¥' + fmt(c.deposit) + ' 已超过「剩余金额 ¥' + fmt(c.baseRemain) + ' 算出的下单货款 ¥' + fmt(c.orderPctTotal) +
          '」，已切换为「定金 + 下单货款（自定义）+ 尾款」模式。参考：<strong>9 成货款 = ¥' + fmt(c.nineTenths) + '</strong>。';
      } else {
        modeHint.className = 'hint';
        modeHint.innerHTML = '四段模式：定金 <strong>¥' + fmt(c.deposit) + '</strong> → 剩余 <strong>¥' + fmt(c.baseRemain) +
          '</strong>，再拆 下单货款 ' + c.orderRatio + '%（¥' + fmt(c.orderTotal) + '）+ 尾款 ' + c.tailRatio + '%（¥' + fmt(c.tailTotal) + '）+ 出货款余额（¥' + fmt(c.shipTotal) + '）。';
      }
    }
    const iOrd = document.querySelector('[data-bind="payment.orderRatio"]');
    const iTail = document.querySelector('[data-bind="payment.tailRatio"]');
    const iCus = document.querySelector('[data-bind="payment.customOrderAmount"]');
    if (iOrd) iOrd.disabled = !!c.threeMode;
    if (iTail) iTail.disabled = !!c.threeMode;
    if (iCus) iCus.disabled = !c.threeMode;

    const efEl = $('#efTotal');
    if (efEl) {
      if (c.extraFeeTotal > 0) {
        efEl.style.display = '';
        efEl.innerHTML = '其他费用合计：<strong>¥' + fmt(c.extraFeeTotal) + '</strong>';
      } else {
        efEl.style.display = 'none';
      }
    }

    c.cabinets.forEach(cr => {
      const id = cr.cab.id;
      const amt = $('#cabamt-' + id);
      if (amt) amt.textContent = '¥' + fmt(cr.subtotal);
      const qtyEl = $('#cabqty-' + id);
      if (qtyEl) qtyEl.textContent = cr.qty > 0 ? (fmtQty(cr.qty) + ' ' + cr.unit) : '—';
      const sub = $('#cabsub-' + id);
      if (sub) sub.textContent = cr.qty > 0 ? (fmtQty(cr.qty) + ' ' + cr.unit + ' · ¥' + fmt(cr.subtotal)) : '未填尺寸';
      const at = $('#cabarea-' + id);
      if (at) at.innerHTML = areaText(cr);
      const dh = $('#cabhint-' + id);
      if (dh) {
        const dt = depthHintText(cr.cab);
        dh.className = 'cb-hint' + (dt.warn ? ' warn' : '');
        dh.textContent = dt.warn
          ? '⚠ 超深 ' + round2(maxDepthOf(cr.cab) - standardDepthOf(cr.cab.type)) + ' mm'
          : '';
        if (dt.warn) dh.setAttribute('title', dt.text);
        else dh.removeAttribute('title');
        const dIn = document.querySelector('[data-cab="' + id + '"] [data-cf="depth"]');
        if (dIn) dIn.setAttribute('title', dt.text);
      }
      refreshAddonChips(id, cr);
      /* 单价标签：后台 / 手填 / 手改 */
      const blk = document.querySelector('.cab-block[data-cab="' + id + '"]');
      if (blk) {
        const pTag = blk.querySelector('.cb-f-price .cell-tag');
        const pInp = blk.querySelector('[data-cf="priceInput"]');
        if (pTag) {
          const diff = priceDiffFromBackend(cr.cab);
          const bp = resolveBackendPrice(cr.cab);
          pTag.className = 'cell-tag ' + (diff !== null ? 'edit' : (bp !== null ? 'ok' : 'warn'));
          pTag.textContent = diff !== null ? '手改' : (bp !== null ? '后台' : '手填');
          if (pInp) pInp.style.background = (diff !== null) ? '#fffbf0' : (bp !== null ? '#f1f5f9' : '');
        }
      }
      const abtn = $('#cabaddonbtn-' + id);
      if (abtn) {
        const n = (DB.addons || []).filter(a => num((cr.cab.addons || {})[a.id]) > 0).length +
          (cr.cab.customAddons || []).filter(a => num(a.qty) > 0).length;
        abtn.textContent = '增项' + (n ? ' ' + n : '');
        const btnEl = abtn.closest('.addon-btn');
        if (btnEl) btnEl.classList.toggle('on', n > 0);
      }
    });

    refreshGlobalBar();
    scheduleDraftRecord();
  }

  function opt(v, label, cur) {
    return '<option value="' + v + '"' + (String(cur) === v ? ' selected' : '') + '>' + esc(label) + '</option>';
  }

  /* ================= 历史 ================= */
  function historyFiltered() {
    const q = historyQuery.trim().toLowerCase();
    return (DB.quotations || []).filter(item => {
      if (histOwnerFilter && String(item.owner || '') !== histOwnerFilter) return false;
      if (!q) return true;
      const hay = [item.quotationNo, item.customer && item.customer.name, item.customer && item.customer.phone,
        item.customer && item.customer.address, item.owner].join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }

  /* 只生成表格行，搜索时只换 tbody，不动输入框（否则中文输入法会被打断） */
  function historyRowsHtml() {
    const list = historyFiltered();
    if (!list.length) return '<tr><td colspan="' + (isAdmin() ? 11 : 9) + '"><div class="empty">没有匹配的报价记录</div></td></tr>';
    return list.map(item => {
      const c = calc(item);
      const st = item.status || 'quoted';
      const stTxt = { draft: '草稿', preset: '待填写', filled: '待报价', quoted: '已报价', deal: '已成交', void: '已作废' }[st] || st;
      const isDraft = (item.status === 'draft');
      const noTxt = item.quotationNo || (isDraft ? '（未编号·草稿）' : '—');
      return '<tr>' +
        '<td>' + esc(noTxt) + '</td>' +
        '<td>' + esc((item.customer && item.customer.name) || '—') + '</td>' +
        '<td>' + esc((item.customer && item.customer.phone) || '—') + '</td>' +
        '<td class="addr-cell" title="' + esc((item.customer && item.customer.address) || '') + '">' +
          esc((item.customer && item.customer.address) || '—') + '</td>' +
        '<td class="num">' + ((item.cabinets || []).length) + ' 个</td>' +
        '<td class="num">¥' + fmt(c.finalTotal) + '</td>' +
        (isAdmin() ? '<td><span class="owner-tag">' + esc(item.owner || '—') + '</span></td>' : '') +
        (isAdmin()
          ? ((c.cost.total > 0)
            ? '<td class="num" title="成本 ¥' + fmt(c.cost.total) + '">¥' + fmt(c.cost.profit) + '<br><small style="color:' + (c.cost.margin >= 25 ? '#15803d' : '#b45309') + '">' + c.cost.margin + '%</small></td>'
            : '<td class="num" style="color:#b6c2d1" title="还没填成本价">—</td>')
          : '') +
        '<td><span class="status ' + st + '">' + stTxt + '</span></td>' +
        '<td>' + esc((item.updatedAt || item.createdAt || '').slice(0, 10)) + '</td>' +
        '<td class="actions">' +
          '<button class="btn small" data-act="openQ" data-id="' + esc(item.id) + '">打开</button> ' +
          '<button class="btn small" data-act="copyQ" data-id="' + esc(item.id) + '">复制</button> ' +
          '<button class="btn small" data-act="viewQ" data-id="' + esc(item.id) + '">预览</button> ' +
          '<button class="btn small danger" data-act="voidQ" data-id="' + esc(item.id) + '">作废</button> ' +
          '<button class="btn small ghost-danger" data-act="delQ" data-id="' + esc(item.id) + '">删除</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function renderHistory() {
    const total = (DB.quotations || []).length;
    const shown = historyFiltered().length;
    return '<section class="card">' +
      '<h2>报价记录 <span class="badge" id="histCount">共 ' + total + ' 条' + (shown !== total ? '（筛出 ' + shown + ' 条）' : '') + (isAdmin() ? '' : ' · 只看得到自己开的单') + '</span></h2>' +
      '<div class="toolbar">' +
        '<input type="text" placeholder="搜索 编号 / 客户 / 电话 / 地址' + (isAdmin() ? ' / 归属' : '') + '" data-search="1" value="' + esc(historyQuery) + '" autocomplete="off">' +
        (isAdmin() ? (function () {
          const owners = [];
          (DB.quotations || []).forEach(q => {
            const o = String(q.owner || '');
            if (o && owners.indexOf(o) < 0) owners.push(o);
          });
          return '<select data-howner="1" title="按归属筛选">' +
            '<option value="">全部归属</option>' +
            owners.map(o => '<option value="' + esc(o) + '"' + (o === histOwnerFilter ? ' selected' : '') + '>' + esc(o) + '</option>').join('') +
            '</select>';
        })() : '') +
        '<div class="grow"></div>' +
        '<button class="btn primary" data-act="newQ">＋ 新建报价</button>' +

  function healthCheck() {
    const issues = [];
    const cfg = DB.config || {};
    const rules = DB.priceRules || [];
    const addons = DB.addons || [];
    const hw = cfg.hardwareUpgrades || [];
    const push = (level, group, title, detail) => issues.push({ level: level, group: group, title: title, detail: detail });

    /* 1. 价格组合重复（同品牌+同柜体材质+同门板材质） */
    const comboMap = {};
    rules.forEach((r, i) => {
      const b = String(r.brand || '').trim();
      const cm = String(r.cabinetMaterial || '').trim();
      const dm = String(r.doorMaterial || '').trim();
      if (!b || !cm || !dm) return;
      const k = [b, cm, dm].join('|');
      if (comboMap[k] === undefined) comboMap[k] = i;
      else push('error', '价格表', '价格组合重复', '第 ' + (comboMap[k] + 1) + ' 行 与 第 ' + (i + 1) + ' 行 都是「' + b + ' + ' + cm + ' + ' + dm + '」，单价 ' + (rules[comboMap[k]].priceSqm || '—') + ' / ' + (r.priceSqm || '—') + '，报价时用哪一行不确定');
    });

    /* 2. 单价漏填 */
    rules.forEach((r, i) => {
      const p = num(r.priceSqm), m = num(r.priceM);
      if (!(p > 0) && !(m > 0)) {
        push('error', '价格表', '单价是 0 或空', '第 ' + (i + 1) + ' 行「' + (r.brand || '?') + ' + ' + (r.cabinetMaterial || '?') + ' + ' + (r.doorMaterial || '?') + '」没有单价，报价会算成 0');
      }
    });

    /* 3. 成本 ≥ 售价（亏本） */
    rules.forEach((r, i) => {
      const p = num(r.priceSqm), c = num(r.costSqm);
      if (p > 0 && c > 0 && c >= p) {
        push('error', '价格表', '成本高于售价', '第 ' + (i + 1) + ' 行「' + (r.brand || '?') + ' + ' + (r.cabinetMaterial || '?') + '」售价 ' + p + '，成本 ' + c + '，每㎡倒亏 ' + round2(c - p));
      } else if (p > 0 && c > 0 && (p - c) / p < 0.15) {
        push('warn', '价格表', '毛利率偏低', '第 ' + (i + 1) + ' 行「' + (r.brand || '?') + ' + ' + (r.cabinetMaterial || '?') + '」毛利率只有 ' + round2((p - c) / p * 100) + '%');
      }
    });

    /* 4. 延米价与投影价差异过大 */
    rules.forEach((r, i) => {
      const p = num(r.priceSqm), m = num(r.priceM);
      if (p > 0 && m > 0 && Math.abs(m - p) / p > 0.05) {
        push('warn', '价格表', '投影价 / 延米价不一致', '第 ' + (i + 1) + ' 行「' + (r.brand || '?') + '」投影 ' + p + ' 元/㎡，延米 ' + m + ' 元/米，差 ' + round2(Math.abs(m - p)) + '（若两者同价，延米栏应留空）');
      }
    });

    /* 5. 价格表用了不在选项里的材质（下拉选不到，永远匹配不上） */
    const cmList = cfg.cabinetMaterials || [];
    const dmList = cfg.doorMaterials || [];
    rules.forEach((r, i) => {
      if (r.cabinetMaterial && cmList.indexOf(r.cabinetMaterial) < 0) {
        push('warn', '价格表', '柜体材质不在选项里', '第 ' + (i + 1) + ' 行用了「' + r.cabinetMaterial + '」，但「选项管理 → 柜体材质」里没有它，开单时下拉选不到');
      }
      if (r.doorMaterial && dmList.indexOf(r.doorMaterial) < 0) {
        push('warn', '价格表', '门板材质不在选项里', '第 ' + (i + 1) + ' 行用了「' + r.doorMaterial + '」，但「选项管理 → 门板材质」里没有它');
      }
    });

    /* 6. 增项同名不同价 */
    const addonMap = {};
    addons.forEach((a, i) => {
      const name = String(a.name || '').trim();
      if (!name) { push('warn', '增项', '增项没名字', '第 ' + (i + 1) + ' 行增项名称为空'); return; }
      if (!(num(a.price) > 0)) push('warn', '增项', '增项单价为 0', '「' + name + '」单价是 0');
      if (addonMap[name] === undefined) addonMap[name] = a;
      else if (num(addonMap[name].price) !== num(a.price)) {
        push('error', '增项', '同名增项单价不同', '「' + name + '」出现两次：' + num(addonMap[name].price) + ' 元 / ' + num(a.price) + ' 元，开单时会算错');
      }
    });

    /* 7. 五金方案同名不同价 */
    const hwMap = {};
    hw.forEach((u, i) => {
      const name = String(u.name || '').trim();
      if (!name) return;
      if (hwMap[name] === undefined) hwMap[name] = u;
      else if (num(hwMap[name].price) !== num(u.price)) {
        push('error', '五金', '同名五金方案加价不同', '「' + name + '」：' + num(hwMap[name].price) + ' / ' + num(u.price));
      }
    });

    /* 8. 选项重复 / 空白 */
    const dupIn = (arr, label) => {
      const seen = {};
      (arr || []).forEach((v, i) => {
        const s = String(v || '').trim();
        if (!s) { push('warn', '选项', label + '有空行', '第 ' + (i + 1) + ' 项是空的'); return; }
        if (seen[s] !== undefined) push('warn', '选项', label + '重复', '「' + s + '」出现了两次，下拉里会有两条一样的');
        else seen[s] = i;
      });
    };
    dupIn(cfg.spaces, '空间名称');
    dupIn(cfg.cabinetNames, '柜子名称');
    dupIn(cfg.cabinetMaterials, '柜体材质');
    dupIn(cfg.doorMaterials, '门板材质');
    const typeSeen = {};
    (cfg.cabinetTypes || []).forEach((t, i) => {
      const nm = typeof t === 'string' ? t : (t.name || '');
      const s = String(nm).trim();
      if (!s) { push('warn', '选项', '柜体类型有空行', '第 ' + (i + 1) + ' 个类型没名字'); return; }
      if (typeSeen[s] !== undefined) push('warn', '选项', '柜体类型重复', '「' + s + '」出现两次');
      else typeSeen[s] = i;
    });

    /* 9. 报价单里同组合不同单价（历史单据） */
    const qList = DB.quotations || [];
    const badQuotes = new Set();
    qList.forEach(q => {
      const m = {};
      (q.cabinets || []).forEach(cab => {
        const key = [effName(cab, 'brand'), effName(cab, 'cabinetMaterial'), effName(cab, 'doorMaterial')].join('|');
        const p = effectiveUnitPrice(cab);
        if (!p || key === '||') return;
        if (m[key] === undefined) m[key] = p;
        else if (Math.abs(m[key] - p) > 0.005) badQuotes.add(q.quotationNo || '（草稿）');
      });
    });
    badQuotes.forEach(no => push('warn', '报价单', '同一单里同材料单价不同', '单据 ' + no + ' 里，相同材料组合的柜体单价不一致，可能是手改过'));

    return issues;
  }

        '<div class="chk-acts">' +
          '<button type="button" class="btn" data-chk="back">返回修改</button>' +

      (issues.length
        ? '<div class="table-wrap" style="max-height:340px;overflow:auto"><table class="data">' +
            '<thead><tr><th>级别</th><th>位置</th><th>问题</th><th>说明</th></tr></thead>' +

  /* 开单前检查：当前这张单的风险点 */
  function checkDraft() {
    const out = [];
    const cabs = draft.cabinets || [];
    cabs.forEach((cab, i) => {
      const cr = calcCabinet(cab, DB.config);
      if (!(cr.qty > 0)) out.push('柜体 ' + (i + 1) + '「' + cabLabel(cab) + '」尺寸没填完，金额会算成 0');
      else if (num(cab.depth) <= 0) out.push('柜体 ' + (i + 1) + '「' + cabLabel(cab) + '」没填深度');
    });

    const byCombo = {};
    cabs.forEach((cab, i) => {
      const key = [effName(cab, 'brand'), effName(cab, 'cabinetMaterial'), effName(cab, 'doorMaterial')].join('|');
      const p = effectiveUnitPrice(cab);
      if (!p || key === '||') return;
      if (byCombo[key] === undefined) byCombo[key] = { p: p, idx: i + 1 };
      else if (Math.abs(byCombo[key].p - p) > 0.005) {
        out.push('柜体 ' + (i + 1) + ' 和柜体 ' + byCombo[key].idx + ' 是同一种材料组合，单价却不同（' + fmt(byCombo[key].p) + ' / ' + fmt(p) + '）');
      }
    });

    const seen = {};
    cabs.forEach((cab, i) => {
      const nm = String(cab.name || '').trim();
      if (!nm) return;
      const k = String(cab.space || '').trim() + '|' + nm;
      if (seen[k]) out.push('柜体 ' + (i + 1) + ' 与柜体 ' + seen[k] + ' 同空间同名（' + (cab.space || '') + ' · ' + nm + '），可能重复录入');
      else seen[k] = i + 1;
    });

    return out;
  }

  /* ================= 报价单 ================= */
  function buildSheet(q, c) {
    const cfg = DB.config;
    const cust = q.customer || {};
    const date = (q.createdAt || new Date().toISOString()).slice(0, 10);
    const isMerged = (cfg.sheetLayout === 'merged');

    const lineRow = (seq, l, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '>' +
      '<td class="center">' + seq + '</td>' +
      '<td>' + esc(l.name) + '</td>' +
      '<td>' + esc(l.spec || '') + '</td>' +
      '<td class="center">' + esc(l.unit) + '</td>' +
      '<td class="num">' + fmtQty(l.qty) + '</td>' +
      '<td class="num">' + fmt(l.price) + '</td>' +
      '<td class="num">' + fmt(l.amount) + '</td>' +
      '</tr>';

    /* 按「空间 + 品牌 + 柜体材质 + 门板材质」分组：同组柜体合在一起算 */
    const groups = [];
    const gmap = {};
    c.cabinets.forEach((cr, idx) => {
      const cab = cr.cab;
      const space = String(cab.space || '');
      const brand = effName(cab, 'brand');
      const cm = effName(cab, 'cabinetMaterial');
      const dm = effName(cab, 'doorMaterial');
      const key = [space, brand, cm, dm].join('|');
      if (!gmap[key]) {
        gmap[key] = { space: space, brand: brand, cm: cm, dm: dm, items: [] };
        groups.push(gmap[key]);
      }
      gmap[key].items.push({ cr: cr, idx: idx });
    });
    /* 分组标题：空间单独一行，品牌 / 柜体材质 / 门板材质带名称标注 */
    const groupTitle = g => [g.space, g.brand, g.cm, g.dm].filter(Boolean).join(' · ');
    const groupTitleHtml = g => {
      const parts = [];
      if (g.brand) parts.push('板材品牌：' + esc(g.brand));
      if (g.cm) parts.push('柜体材质：' + esc(g.cm));
      if (g.dm) parts.push('门板材质：' + esc(g.dm));
      return '<div class="g-head">' +
        '<span class="g-space">' + esc(g.space || '未分类') + '</span>' +
        (parts.length ? '<span class="g-spec">' + parts.join('　') + '</span>' : '') +
      '</div>';
    };

    /* 分开版：表一柜体 / 表二增项；合并版：同一分组内柜体与增项混排在一张表 */
    const cabRows = [];
    const addonRows = [];
    const mergedRows = [];
    groups.forEach(g => {
      const gTitle = groupTitleHtml(g);
      cabRows.push('<tr class="sheet-group-row"><td colspan="7">' + gTitle + '</td></tr>');
      mergedRows.push('<tr class="sheet-group-row"><td colspan="7">' + gTitle + '</td></tr>');
      let gsum = 0;
      let gsumAll = 0;

      g.items.forEach(it => {
        const cr = it.cr;
        const cab = cr.cab;
        const label = cabLabel(cab);
        const cabLines = cr.lines.filter(l => l.kind !== 'addon' && l.kind !== 'drawer' && l.kind !== 'surcharge');
        const addLines = cr.lines.filter(l => l.kind === 'addon');
        const subLines = cr.lines.filter(l => l.kind === 'surcharge' || l.kind === 'drawer');
        const subAmt = round2(subLines.reduce((s, l) => s + l.amount, 0));
        /* 柜体行只算投影/延米基础价，加价项与抽屉另外单列 */
        const cabAmt = round2(cr.subtotal - cr.addonAmount - subAmt);

        let cabRowHtml = '';
        if (cabLines.length) {
          const baseLine = cabLines[0];
          gsum += cabAmt;
          cabRowHtml = '<tr>' +
            '<td class="center">' + (it.idx + 1) + '</td>' +
            '<td>' + esc(label) + '</td>' +
            '<td>' + esc(baseLine.spec || '') + '</td>' +
            '<td class="center">' + esc(cr.unit) + '</td>' +
            '<td class="num">' + fmtQty(cr.qty) + '</td>' +
            '<td class="num">' + fmt(cr.price) + '</td>' +
            '<td class="num">' + fmt(cabAmt) + '</td>' +
            '</tr>';
        } else {
          cabRowHtml = '<tr><td class="center">' + (it.idx + 1) + '</td><td>' + esc(label) +
            '</td><td colspan="5" style="color:#999">未填写尺寸</td></tr>';
        }
        cabRows.push(cabRowHtml);
        mergedRows.push(cabRowHtml);

        /* 超深加价 / 五金升级 / 肤感面 / 抽屉超出：各占一行 */
        subLines.forEach((l, i) => {
          const row = lineRow((it.idx + 1) + '-' + (i + 1), l, 'sheet-sub-line');
          cabRows.push(row);
          mergedRows.push(row);
        });
        gsum += subAmt;

        /* 合并版：增项紧跟在所属柜体下面 */
        let addAmt = 0;
        if (addLines.length) {
          addLines.forEach((l, i) => {
            addAmt += l.amount;
            mergedRows.push(lineRow('增' + (it.idx + 1) + '.' + (i + 1), l, 'sheet-addon-line'));
          });
        }
        gsumAll += cabAmt + subAmt + addAmt;

        if (addLines.length) {
          addonRows.push('<tr class="sheet-group-row"><td colspan="7">' + esc([g.space, label].filter(Boolean).join(' · ')) + '</td></tr>');
          addLines.forEach((l, i) => addonRows.push(lineRow('增' + (it.idx + 1) + '.' + (i + 1), l)));
        }
      });

      cabRows.push('<tr class="sheet-subtotal"><td colspan="6">' + esc(g.space || '本组') + ' 小计</td><td class="num">¥' + fmt(round2(gsum)) + '</td></tr>');
      mergedRows.push('<tr class="sheet-subtotal"><td colspan="6">' + esc(g.space || '本组') + ' 小计</td><td class="num">¥' + fmt(round2(gsumAll)) + '</td></tr>');
    });

    /* 表三：其他费用（运输 / 上楼 / 安装等） */
    const fees = (q.extraFees || []).filter(f => num(f.amount) > 0 || String(f.name || '').trim());
    const feeLine = (seq, f) => {
      const amt = round2(num(f.amount));
      return '<tr>' +
        '<td class="center">' + seq + '</td>' +
        '<td>' + esc(String(f.name || '').trim() || '其他费用') + '</td>' +
        '<td></td>' +
        '<td class="center">项</td>' +
        '<td class="num">1</td>' +
        '<td class="num">' + fmt(amt) + '</td>' +
        '<td class="num">' + fmt(amt) + '</td>' +
        '</tr>';
    };
    const feeRows = fees.map((f, i) => feeLine('费' + (i + 1), f));
    if (fees.length) {
      mergedRows.push('<tr class="sheet-group-row"><td colspan="7">其他费用</td></tr>');
      fees.forEach((f, i) => mergedRows.push(feeLine('费' + (i + 1), f)));
      mergedRows.push('<tr class="sheet-subtotal"><td colspan="6">其他费用 小计</td><td class="num">¥' + fmt(c.extraFeeTotal) + '</td></tr>');
    }

    const tableHead = '<thead><tr>' +
      '<th style="width:44px">序号</th><th>项目名称</th><th>规格 / 说明</th>' +
      '<th style="width:54px">单位</th><th style="width:60px">数量</th>' +
      '<th style="width:70px">单价</th><th style="width:82px">金额</th>' +
      '</tr></thead>';

    const sheetTable = (bodyRows, subtotal, label) =>
      '<table class="sheet-table">' + tableHead +
        '<tbody>' + bodyRows.join('') +
          '<tr class="sheet-subtotal"><td colspan="6">' + label + '</td><td class="num">¥' + fmt(subtotal) + '</td></tr>' +
        '</tbody>' +
      '</table>';

    const mergedTable = bodyRows =>
      '<table class="sheet-table">' + tableHead +
        '<tbody>' + bodyRows.join('') + '</tbody>' +
      '</table>';

    const discRow = c.addonDiscountTotal > 0
