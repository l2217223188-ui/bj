<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定制衣柜报价系统</title>
<style>
﻿.role-sel { border: 1px solid #d5dde7; border-radius: 5px; padding: 2px 4px; font-size: 12px; background: #fff; }
/* 归属标记 */
.owner-tag { font-size: 11.5px; color: #475569; background: #eef2f7; border-radius: 8px; padding: 1px 7px; }
/* ============ 账号状态 / 操作日志 ============ */
.st-on { color: #15803d; background: #e8f6ec; border-radius: 8px; padding: 1px 7px; font-size: 11px; }
.st-off { color: #b91c1c; background: #fdecec; border-radius: 8px; padding: 1px 7px; font-size: 11px; }
.log-act { font-size: 11.5px; color: #1f4e79; background: #eef4fa; border-radius: 8px; padding: 1px 7px; white-space: nowrap; }
/* ============ 保存前价格同步确认 ============ */
.sync-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(12, 26, 42, .5);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.sync-card {
  background: #fff; border-radius: 12px; width: 100%; max-width: 620px;
  max-height: 86vh; overflow: auto; padding: 20px 22px;
  box-shadow: 0 24px 60px rgba(6,24,44,.4);
}
.sync-card h3 { margin: 0 0 8px; font-size: 15px; color: #1f2c3d; }
.sync-tip { font-size: 12px; color: #64748b; line-height: 1.7; margin: 0 0 12px; }
.sync-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.sync-table th {
  text-align: left; font-weight: 500; color: #64748b; font-size: 11.5px;
  padding: 6px 8px; border-bottom: 1px solid #e3eaf2; background: #f7fafd;
}
.sync-table td { padding: 7px 8px; border-bottom: 1px solid #eef3f8; vertical-align: top; }
.sync-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.sync-table .sync-ck { width: 15px; height: 15px; accent-color: #1f4e79; cursor: pointer; }
.sync-acts { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
/* ============ 已选增项提示 ============ */
.addon-btn.on { background: #fdf3e3; border-color: #e6c98a; color: #b45309; font-weight: 600; }
.addon-btn.on:hover { background: #fbecd2; }
.cb-addons {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin-top: 8px; padding: 7px 9px; cursor: pointer;
  background: #fffaf0; border: 1px dashed #e6c98a; border-radius: 7px;
}
.cb-addons:hover { background: #fdf4e3; border-color: #d9b36a; }
.cb-addons .ad-label {
  font-size: 11px; color: #b45309; font-weight: 600; flex: none;
  background: #f7e3bf; border-radius: 5px; padding: 2px 7px;
}
.ad-chip {
  display: inline-flex; align-items: baseline; gap: 4px;
  background: #fff; border: 1px solid #ecd7b0; border-radius: 6px;
  padding: 2px 7px; font-size: 11.5px; color: #475569;
}
.ad-chip b { font-weight: 600; color: #334155; }
.ad-chip em { font-style: normal; color: #64748b; }
.ad-chip i { font-style: normal; color: #b45309; font-variant-numeric: tabular-nums; }
.ad-chip u { text-decoration: none; color: #15803d; font-size: 10.5px; }
.cb-addons .ad-sum { margin-left: auto; font-size: 12px; color: #b45309; font-weight: 600; }
/* ============ 成本毛利页 ============ */
.cost-sum { display: flex; gap: 12px; flex-wrap: wrap; }
.cs-item {
  flex: 1 1 160px; background: #f4f8fc; border: 1px solid #dbe6f1;
  border-radius: 8px; padding: 10px 14px;
}
.cs-item span { display: block; font-size: 11.5px; color: #64748b; margin-bottom: 4px; }
.cs-item b { font-size: 17px; color: #1f4e79; font-variant-numeric: tabular-nums; }
.cs-item b.ok { color: #15803d; }
.cs-item b.warn { color: #b45309; }
.cs-item b.bad { color: #b91c1c; }
.margin { font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 8px; }
.margin.ok { background: #e8f6ec; color: #15803d; }
.margin.warn { background: #fdf3e3; color: #b45309; }
.margin.bad { background: #fdecec; color: #b91c1c; }
.cost-other { width: 92px; }
.hidden { display: none !important; }
/* ============ 柜体录入：每个柜体两行 ============ */
.cab-blocks { display: flex; flex-direction: column; gap: 10px; }
.cab-block {
  border: 1px solid #e3eaf2; border-radius: 10px;
  padding: 10px 12px 9px; background: #fbfdff;
}
.cab-block.cb-open { border-color: #9db8d4; box-shadow: 0 0 0 2px rgba(31,78,121,.08); }
.cb-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 10px; }
.cb-bot {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 10px;
  margin-top: 9px; padding-top: 9px; border-top: 1px dashed #e6edf5;
}
.cb-idx {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: #1f4e79; color: #fff; font-size: 11.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; margin-bottom: 3px;
}
.cb-f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cb-f > i { font-style: normal; font-size: 10.5px; color: #94a3b8; line-height: 1; }
.cb-f select, .cb-f input {
  border: 1px solid #d5dde7; border-radius: 5px; padding: 4px 6px;
  font-size: 12px; background: #fff; color: #1f2c3d; min-width: 0;
}
.cb-f select:focus, .cb-f input:focus { outline: none; border-color: #1f4e79; box-shadow: 0 0 0 2px rgba(31,78,121,.1); }
.cb-f input[readonly] { background: #f1f5f9; }
.cb-f select { min-width: 74px; }
.cb-f .cell-combo { display: flex; gap: 3px; width: 132px; }
.cb-f .cell-combo input { flex: 1; min-width: 0; }
.cb-f .cell-custom { margin-top: 3px; border-color: #e6c98a; background: #fffbf0; font-size: 11.5px; }
.cb-f-space { width: 104px; }
.cb-f-narrow select, .cb-f-narrow input { width: 68px; }
.cb-f-price input { width: 84px; }
.cb-f-name input { width: 156px; }
.cb-f-dim input { width: 72px; }
.cb-right { display: flex; align-items: flex-end; gap: 10px; margin-left: auto; }
.cb-amt { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; min-width: 78px; }
.cb-amt b { font-size: 14px; color: #1f4e79; font-variant-numeric: tabular-nums; }
.cb-amt small { font-size: 10.5px; color: #94a3b8; }
.cb-acts { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; align-self: center; }
.cb-acts .btn { padding: 3px 7px; font-size: 11.5px; }
.cb-hint { font-size: 11px; color: #94a3b8; align-self: center; }
.cb-f-remark { flex: 1 1 170px; min-width: 140px; }
.cb-f-remark input { width: 100%; }
.cb-hint.warn { color: #b45309; }
.cb-f .cell-tag { font-size: 10px; color: #94a3b8; margin-top: 1px; }
.cb-f .cell-tag.ok { color: #15803d; }
.cb-f .cell-tag.warn { color: #b45309; }
.cb-f .cell-tag.edit { color: #b45309; font-weight: 700; background: #fdf3e3; border-radius: 6px; padding: 0 5px; }
.cb-f-price input { background: #f1f5f9; }
.cb-f-price input:focus { background: #fff; }
@media (max-width: 1280px) {
  .cb-f-space { width: 100px; }
  .cb-f select { min-width: 78px; }
}
/* ============ 登录态 / 账号 ============ */
.topbar-right { display: flex; align-items: center; gap: 10px; }
.topbar-right .who { font-size: 12px; color: rgba(255,255,255,.85); }
.logout-btn {
  border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff;
  border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
}
.logout-btn:hover { background: rgba(255,255,255,.12); }
.must-change {
  font-size: 11.5px; color: #ffe1a8; background: rgba(180,83,9,.35);
  border: 1px solid rgba(255,200,120,.45); border-radius: 6px; padding: 3px 8px;
}
.hidden { display: none !important; }
.acct-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .acct-grid { grid-template-columns: 1fr; } }
.acct-box { border: 1px solid #e3eaf2; border-radius: 8px; padding: 12px 14px; background: #fbfdff; }
.acct-title { font-size: 13px; font-weight: 600; color: #1f4e79; margin-bottom: 10px; }
.acct-box .field { margin-bottom: 10px; }
.acct-box .field label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
.acct-box .field input, .acct-box .field select {
  width: 100%; border: 1px solid #d5dde7; border-radius: 6px; padding: 7px 10px; font-size: 13px;
}
.tag-me { background: #e6f0fa; color: #1f4e79; border-radius: 8px; padding: 1px 6px; font-size: 10.5px; }
/* ============ 成本 / 毛利 ============ */
.cost-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 4px 0; font-size: 12.5px; color: #475569;
}
.cost-row b { font-size: 14px; color: #1f4e79; font-variant-numeric: tabular-nums; }
.cost-row b.ok { color: #15803d; }
.cost-row b.bad { color: #b91c1c; }
.cost-detail { font-size: 10.5px; color: #94a3b8; line-height: 1.6; margin-top: 2px; }
/* 表格里「输入框 + 下拉箭头」的单元格 */
.cell-combo { display: flex; align-items: center; gap: 3px; }
.cell-combo input { flex: 1; min-width: 0; }
.combo-arrow {
  flex: none;
  border: 1px solid #d5dde7; background: #fff; color: #64748b;
  border-radius: 5px; height: 23px; padding: 0 4px;
  font-size: 10px; line-height: 1; cursor: pointer;
}
.combo-arrow:hover { background: #eef4fa; color: #1f4e79; border-color: #9db8d4; }

/* 下拉浮层 */
.combo-pop {
  position: fixed; z-index: 80;
  background: #fff; border: 1px solid #d5dde7; border-radius: 8px;
  box-shadow: 0 10px 30px rgba(16,24,40,.18);
  padding: 4px; max-height: 280px; overflow-y: auto;
}
.combo-pop button {
  display: block; width: 100%; text-align: left;
  border: none; background: none; cursor: pointer;
  padding: 6px 10px; font-size: 12.5px; color: #334155; border-radius: 5px;
}
.combo-pop button:hover { background: #f1f6fc; color: #1f4e79; }
.combo-pop button.active { background: #e6f0fa; color: #1f4e79; font-weight: 600; }
.combo-pop .combo-empty { padding: 8px 10px; font-size: 12px; color: #94a3b8; }
.combo-pop .combo-count {
  padding: 5px 10px 3px; margin-top: 3px; border-top: 1px dashed #e6edf5;
  font-size: 10.5px; color: #94a3b8; text-align: right;
}
/* ============ 基础 ============ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #f2f5f9;
  color: #1f2937;
  font-size: 14px;
  line-height: 1.6;
}
button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ============ 顶栏 ============ */
.topbar {
  display: flex; align-items: center; gap: 24px;
  padding: 0 20px; height: 60px;
  background: #1f4e79; color: #fff;
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 38px; height: 38px; border-radius: 8px;
  background: #fff; color: #1f4e79;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; letter-spacing: .5px;
  overflow: hidden;
}
.logo.has-img { background: transparent; }
.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text strong { font-size: 15px; }
.brand-text small { font-size: 11px; opacity: .75; }

.tabs { display: flex; gap: 4px; }
.tabs button {
  border: none; background: transparent; color: rgba(255,255,255,.75);
  padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
}
.tabs button:hover { background: rgba(255,255,255,.1); color: #fff; }
.tabs button.active { background: #fff; color: #1f4e79; font-weight: 600; }
.topbar-right { margin-left: auto; }
.save-state { font-size: 12px; opacity: .8; }

/* ============ 布局 ============ */
#view { padding: 18px 20px 60px; max-width: 1700px; margin: 0 auto; }
/* 汇总固定在右上角，表格吃满左侧整宽，一屏看全所有列 */
.workspace { display: block; }
.workspace .left-col { padding-right: 376px; }
.workspace.sum-collapsed .left-col { padding-right: 0; }
@media (max-width: 1280px) {
  .workspace .left-col { padding-right: 356px; }
}

.card {
  background: #fff; border-radius: 10px; padding: 16px 18px;
  box-shadow: 0 1px 3px rgba(16,24,40,.08);
  margin-bottom: 16px;
}
.card h2 {
  font-size: 15px; margin: 0 0 14px; padding-bottom: 10px;
  border-bottom: 1px solid #eef2f7; color: #1f4e79;
  display: flex; align-items: center; gap: 8px;
}
.card h2 .badge {
  background: #eaf1f9; color: #1f4e79; font-size: 11px; font-weight: 600;
  padding: 1px 8px; border-radius: 10px;
}

/* ============ 表单 ============ */
.field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; }
.field-grid.two { grid-template-columns: repeat(2, 1fr); }
.field-grid.four { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .field-grid, .field-grid.four { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }

.field { display: flex; flex-direction: column; gap: 4px; }
.field.span2 { grid-column: span 2; }
.field.span3 { grid-column: span 3; }
/* 报价记录里的安装地址：太长时省略，悬停看全 */
.data td.addr-cell {
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.field label { font-size: 12px; color: #64748b; font-weight: 500; }
.field input, .field select, .field textarea {
  border: 1px solid #d5dde7; border-radius: 6px; padding: 7px 10px;
  outline: none; background: #fff; color: #1f2937; width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: #1f4e79; box-shadow: 0 0 0 3px rgba(31,78,121,.12);
}
.field input[type="number"] { text-align: right; }
.field .hint { font-size: 11px; color: #94a3b8; }
.field .hint.warn { color: #b45309; }

/* 单选卡片 */
.radio-row { display: flex; flex-wrap: wrap; gap: 8px; }
.radio-card {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid #d5dde7; border-radius: 6px; padding: 6px 12px;
  cursor: pointer; font-size: 13px; background: #fff;
  user-select: none;
}
.radio-card input { accent-color: #1f4e79; }
.radio-card.active { border-color: #1f4e79; background: #f0f6fc; font-weight: 600; }
.radio-card.disabled { opacity: .45; cursor: not-allowed; }

/* ============ 品牌条 ============ */
.brand-strip {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;
}
.brand-chip {
  border: 1px solid #d5dde7; background: #fff; border-radius: 8px;
  padding: 8px 12px; cursor: pointer; text-align: left; min-width: 118px;
  transition: all .12s;
}
.brand-chip:hover { border-color: #9db8d4; }
.brand-chip.active { border-color: #1f4e79; background: #f0f6fc; box-shadow: 0 0 0 2px rgba(31,78,121,.1); }
.brand-chip .bn { font-weight: 600; font-size: 13px; display: block; }
.brand-chip .bs { font-size: 11px; color: #7b8a9c; display: block; }
.brand-chip .bp { font-size: 12px; color: #1f4e79; font-weight: 600; margin-top: 2px; display: block; }

/* ============ 增项 ============ */
.addon-group { margin-bottom: 10px; }
.addon-group > summary {
  cursor: pointer; font-weight: 600; font-size: 13px; color: #1f4e79;
  padding: 8px 10px; background: #f4f8fc; border-radius: 6px;
  display: flex; justify-content: space-between; list-style: none;
}
.addon-group > summary::-webkit-details-marker { display: none; }
.addon-group > summary::after { content: "▾"; color: #9db8d4; }
.addon-group[open] > summary::after { content: "▴"; }
.addon-list { padding: 6px 2px 0; }
.addon-row {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) 104px 62px 82px 82px;
  align-items: center; gap: 8px;
  padding: 5px 6px; border-radius: 6px; font-size: 13px;
}
.addon-row .au { white-space: nowrap; }
.addon-head {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) 104px 62px 82px 82px;
  gap: 8px; padding: 2px 6px 5px; font-size: 11px; color: #94a3b8;
}
.addon-head span:nth-child(5), .addon-head span:nth-child(6) { text-align: right; }

/* 增项单项优惠 */
.addon-disc {
  display: flex; align-items: center; gap: 8px;
  padding: 0 6px 8px 34px; font-size: 12px; color: #b45309;
}
.addon-disc .disc-free { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.addon-disc .disc-free input { accent-color: #b45309; }
.addon-disc .disc-amt {
  width: 92px; border: 1px solid #e6c98a; border-radius: 5px;
  padding: 3px 6px; text-align: right; background: #fffbf0; font-size: 12px;
}
.addon-disc .disc-amt:disabled { background: #f1f5f9; color: #cbd5e1; }
.addon-row .apx {
  width: 100%; border: 1px solid #d5dde7; border-radius: 5px;
  padding: 4px 6px; text-align: right; font-size: 12px; background: #fff;
}
.addon-row .apx:focus { outline: none; border-color: #1f4e79; }
.addon-row .aspec {
  width: 100%; border: 1px solid #d5dde7; border-radius: 5px;
  padding: 4px 6px; font-size: 12px; background: #fff; text-align: left;
}
.addon-row .aspec:focus { outline: none; border-color: #1f4e79; }
.addon-row:hover { background: #f8fafc; }
.addon-row.checked { background: #f0f6fc; }
.addon-row .cb { accent-color: #1f4e79; width: 16px; height: 16px; cursor: pointer; }
.addon-row .an { }
.addon-row .au { color: #7b8a9c; font-size: 12px; }
.addon-row .ap { color: #1f4e79; font-weight: 600; text-align: right; font-size: 12px; }
.addon-row .aq { width: 100%; border: 1px solid #d5dde7; border-radius: 5px; padding: 4px 6px; text-align: right; }
.addon-row .aq:disabled { background: #f1f5f9; color: #cbd5e1; }

/* ============ 汇总面板 ============ */
.summary-card {
  position: fixed; top: 70px; right: 16px;
  width: 360px;
  max-height: calc(100vh - 86px);
  overflow-y: auto;
  z-index: 30;
  background: #fff; border-radius: 10px; padding: 16px 18px;
  box-shadow: 0 8px 28px rgba(16,24,40,.16);
}
.workspace.sum-collapsed .summary-card { display: none; }
@media (max-width: 1280px) {
  .summary-card { width: 340px; }
}
.summary-card h2 { margin-bottom: 12px; }
.sum-line { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; font-size: 13px; }
.sum-line .sl-name { color: #475569; }
.sum-line .sl-formula { color: #94a3b8; font-size: 11px; }
.sum-line .sl-amt { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.sum-line.muted .sl-amt { color: #64748b; font-weight: 500; }
.sum-divider { height: 1px; background: #eef2f7; margin: 10px 0; }
.sum-total { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 0; }
.sum-total .label { font-size: 13px; color: #475569; }
.sum-total .value { font-size: 26px; font-weight: 700; color: #1f4e79; font-variant-numeric: tabular-nums; }
.sum-discount .value { color: #b91c1c; }
.pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.pay-item { background: #f4f8fc; border-radius: 8px; padding: 8px 10px; }
.pay-item .pl { font-size: 11px; color: #64748b; }
.pay-item .pv { font-size: 15px; font-weight: 700; color: #1f4e79; font-variant-numeric: tabular-nums; }
.pay-item .pr { font-size: 11px; color: #94a3b8; }

.summary-actions { display: flex; gap: 8px; margin-top: 14px; }
.summary-actions .btn { flex: 1; }

/* ============ 按钮 ============ */
.btn {
  border: 1px solid #d5dde7; background: #fff; color: #334155;
  padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  transition: all .12s; white-space: nowrap;
}
.btn:hover { border-color: #9db8d4; background: #f8fafc; }
.btn.primary { background: #1f4e79; border-color: #1f4e79; color: #fff; font-weight: 600; }
.btn.primary:hover { background: #173d5f; }
.btn.ghost { background: transparent; }
.btn.danger { color: #b91c1c; border-color: #f3c8c8; }
.btn.danger:hover { background: #fef2f2; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ============ 表格 ============ */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td {
  padding: 9px 10px; border-bottom: 1px solid #eef2f7; text-align: left;
  white-space: nowrap;
}
table.data th { background: #f8fafc; color: #475569; font-weight: 600; font-size: 12px; }
table.data tbody tr:hover { background: #f8fafc; }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data td.actions { text-align: right; }
.empty { padding: 40px; text-align: center; color: #94a3b8; }

.status {
  display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
}
.status.draft { background: #f1f5f9; color: #64748b; }
.status.quoted { background: #eaf1f9; color: #1f4e79; }
.status.deal { background: #e8f7ee; color: #15803d; }
.status.void { background: #fef2f2; color: #b91c1c; text-decoration: line-through; }

/* ============ 工具栏 ============ */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.toolbar input, .toolbar select {
  border: 1px solid #d5dde7; border-radius: 6px; padding: 7px 10px; background: #fff;
}
.toolbar .grow { flex: 1; }

/* ============ 设置页 ============ */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1100px) { .settings-grid { grid-template-columns: 1fr; } }
.mini-input {
  border: 1px solid #d5dde7; border-radius: 5px; padding: 4px 8px;
  width: 96px; text-align: right; background: #fff;
}
.mini-input.wide { width: 100%; text-align: left; }
textarea.terms { width: 100%; min-height: 130px; border: 1px solid #d5dde7; border-radius: 6px; padding: 10px; line-height: 1.8; }

/* ============ 弹窗 ============ */
.modal {
  position: fixed; inset: 0; background: rgba(15,23,42,.55);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 20px; z-index: 100; overflow: auto;
}
.modal.hidden { display: none; }
.modal-box {
  background: #fff; border-radius: 10px; width: min(900px, 100%);
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.modal-actions {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid #eef2f7;
  position: sticky; top: 0; background: #fff; border-radius: 10px 10px 0 0; z-index: 2;
}
.modal-title { font-weight: 600; color: #1f4e79; }
.spacer { flex: 1; }
.modal-body { padding: 20px; }

/* ============ 报价单（屏幕 & 打印共用） ============ */
.sheet {
  background: #fff; width: 100%; max-width: 780px; margin: 0 auto;
  color: #111; font-size: 12px; line-height: 1.55;
}
.sheet-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  border-bottom: 2px solid #1f4e79; padding-bottom: 10px; margin-bottom: 12px;
}
.sheet-head .store { font-size: 18px; font-weight: 700; color: #1f4e79; }
.sheet-head .store-sub { font-size: 11px; color: #555; margin-top: 2px; }
.sheet-head .title { text-align: right; }
.sheet-head .title h1 { font-size: 18px; margin: 0; letter-spacing: 4px; }
.sheet-head .title .meta { font-size: 11px; color: #555; margin-top: 4px; }

.sheet-info {
  display: grid; grid-template-columns: 1fr 1fr; gap: 2px 20px;
  font-size: 11.5px; margin-bottom: 12px;
}
.sheet-info .row { display: flex; gap: 6px; }
.sheet-info .k { color: #666; white-space: nowrap; }
.sheet-info .v { border-bottom: 1px dashed #ccc; flex: 1; min-height: 16px; }

.sheet-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.sheet-table th, .sheet-table td { border: 1px solid #d9d9d9; padding: 4px 6px; }
.sheet-table th { background: #eef3f8; font-weight: 600; }
.sheet-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.sheet-table td.center { text-align: center; }
.sheet-group-row td {
  background: #f7fafc; font-weight: 700; color: #1f4e79;
}
/* 分组标题：空间 + 带名称标注的材质行 */
.sheet-group-row .g-head { display: flex; flex-direction: column; gap: 2px; }
.sheet-group-row .g-space { font-size: 12.5px; font-weight: 700; color: #1f4e79; }
.sheet-group-row .g-spec {
  font-size: 10.5px; font-weight: 400; color: #475569; letter-spacing: .2px;
}
/* 每张表末尾的小计行 */
.sheet-subtotal td {
  background: #eef4fa;
  font-weight: 700;
  color: #1f4e79;
  border-top: 1.5px solid #b9cee4;
}
.sheet-subtotal td.num { font-size: 12.5px; }

/* ============ 图片上传（Logo / 收款码） ============ */
.img-ups { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.img-up { border: 1px solid #e3eaf2; border-radius: 8px; padding: 10px 12px; background: #fbfdff; }
.img-up-label { font-size: 12px; color: #64748b; margin-bottom: 8px; }
.img-up-body { display: flex; align-items: center; gap: 12px; }
.img-up-preview {
  width: 96px; height: 96px; border-radius: 6px; border: 1px dashed #cbd7e4;
  display: flex; align-items: center; justify-content: center;
  background: #fff; overflow: hidden; flex: none;
}
.img-up-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
.img-up-empty { font-size: 11px; color: #b6c2d1; }
.img-up-btns { display: flex; flex-direction: column; gap: 6px; }
.img-up-btns label.btn { cursor: pointer; text-align: center; }

/* 报价单上的 Logo 与收款码 */
.sheet-head .sheet-logo { max-height: 46px; max-width: 150px; object-fit: contain; margin-bottom: 4px; display: block; }
.sheet-sign { display: flex; gap: 24px; align-items: flex-end; }
.sheet-sign > div:not(.sheet-qr) { flex: 1; }
.sheet-qr { flex: none; text-align: center; }
.sheet-qr img { width: 92px; height: 92px; object-fit: contain; border: 1px solid #e3eaf2; border-radius: 4px; }
.sheet-qr .qr-cap { font-size: 9.5px; color: #555; margin-top: 3px; }

/* 合并表里夹在柜体下面的增项行 */
.sheet-table tr.sheet-addon-line td {
  background: #fcfdff;
  color: #64748b;
  font-size: 11px;
}
.sheet-table tr.sheet-addon-line td:nth-child(2) { padding-left: 20px; }

/* 抽屉超出配比：单独一行，跟在柜体下面 */
.sheet-table tr.sheet-sub-line td {
  background: #fffdf7;
  color: #475569;
  font-size: 11.5px;
}
.sheet-table tr.sheet-sub-line td:nth-child(2) { padding-left: 20px; }

.sheet-totals { margin-top: 10px; display: flex; justify-content: flex-end; }
.sheet-totals table { border-collapse: collapse; font-size: 12px; min-width: 320px; }
.sheet-totals td { padding: 3px 10px; }
.sheet-totals td.k { color: #555; text-align: right; }
.sheet-totals td.v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 110px; }
.sheet-totals tr.grand td { border-top: 1.5px solid #1f4e79; font-size: 15px; color: #1f4e79; padding-top: 6px; }
.sheet-totals tr.discount td.v { color: #b91c1c; }

.sheet-section-title {
  font-weight: 700; color: #1f4e79; font-size: 12px;
  margin: 14px 0 6px; padding-left: 6px; border-left: 3px solid #1f4e79;
}

.sheet-terms { font-size: 10.5px; color: #444; line-height: 1.7; }
.sheet-terms ol { margin: 4px 0 0; padding-left: 18px; }

.sheet-sign { display: flex; gap: 40px; margin-top: 22px; font-size: 11.5px; }
.sheet-sign > div { flex: 1; }
.sheet-sign .line { border-bottom: 1px solid #999; height: 26px; margin-top: 4px; }
.sheet-foot { margin-top: 14px; font-size: 10px; color: #888; text-align: center; border-top: 1px dotted #ccc; padding-top: 6px; }

/* ============ 打印 ============ */
@page { size: A4; margin: 12mm 10mm; }
@media print {
  body { background: #fff; }
  .topbar, #view, #toast, .modal-actions { display: none !important; }
  .modal { position: static; display: block !important; background: none; padding: 0; overflow: visible; }
  .modal.hidden { display: block !important; }
  .modal-box { box-shadow: none; width: auto; border-radius: 0; }
  .modal-body { padding: 0; }
  .sheet { max-width: none; font-size: 11px; }
  .sheet-table { font-size: 10.5px; }
}

/* ============ 提示 ============ */
.toast {
  position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%) translateY(20px);
  background: #1f2937; color: #fff; padding: 10px 20px; border-radius: 8px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.hidden { display: none !important; }
.spin { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ 柜体卡片（v2 多柜体） ============ */
.cab-card {
  border: 1px solid #e3eaf2; border-radius: 9px; margin-bottom: 14px;
  background: #fcfdff; overflow: hidden;
}
.cab-card:last-child { margin-bottom: 0; }
.cab-head {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; background: #f4f8fc; border-bottom: 1px solid #e3eaf2;
}
.cab-index {
  font-size: 12px; font-weight: 700; color: #1f4e79;
  background: #e2eefa; padding: 2px 9px; border-radius: 10px; white-space: nowrap;
}
.cab-name {
  border: 1px solid transparent; background: transparent; border-radius: 5px;
  padding: 4px 8px; font-size: 13px; color: #1f2937; flex: 1; min-width: 120px;
}
.cab-name:hover { border-color: #d5dde7; background: #fff; }
.cab-name:focus { outline: none; border-color: #1f4e79; background: #fff; }
.cab-sub { font-size: 12px; color: #1f4e79; font-weight: 600; white-space: nowrap; }
.cab-actions { display: flex; gap: 6px; }
.cab-body { padding: 12px 14px 14px; }

.custom-row {
  display: grid; grid-template-columns: 1fr 200px; gap: 10px 14px;
  margin-top: 10px; padding: 10px 12px; background: #fffbf0;
  border: 1px dashed #e6c98a; border-radius: 7px;
}
@media (max-width: 640px) { .custom-row { grid-template-columns: 1fr; } }

.cab-addons { margin-top: 12px; border-top: 1px dashed #e3eaf2; padding-top: 10px; }
.cab-addons > summary {
  cursor: pointer; font-size: 12.5px; font-weight: 600; color: #1f4e79;
  list-style: none; padding: 4px 0;
}
.cab-addons > summary::-webkit-details-marker { display: none; }
.cab-addons > summary::before { content: "▸ "; color: #9db8d4; }
.cab-addons[open] > summary::before { content: "▾ "; }

.sum-line.cab-line { padding: 5px 0; }
.sum-line.cab-line .sl-name { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 卡片标题里的操作按钮 */
.card h2 .btn { margin-left: auto; }
.card h2 .spacer { flex: 1; }

/* ============ 选项管理（空间 / 材质） ============ */
.opt-box { border: 1px solid #e6edf5; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #fbfdff; }
.opt-box:last-child { margin-bottom: 0; }
.opt-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 700; color: #1f4e79; margin-bottom: 8px;
}
.opt-head .btn { margin-left: auto; }
.opt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.opt-row:last-child { margin-bottom: 0; }

/* ============ 提示态 ============ */
.hint.ok { color: #15803d; }
.hint.warn { color: #b45309; }

/* ============ 其他费用（运输/上楼/安装） ============ */
.ef-row {
  display: grid; grid-template-columns: minmax(0, 1fr) 140px 72px;
  gap: 8px; align-items: center; margin-bottom: 8px;
}
.ef-row:last-child { margin-bottom: 0; }
.ef-name {
  border: 1px solid #d5dde7; border-radius: 6px; padding: 7px 10px;
  background: #fff; width: 100%;
}
.ef-amt {
  border: 1px solid #d5dde7; border-radius: 6px; padding: 7px 10px;
  background: #fff; width: 100%; text-align: right;
}
.ef-name:focus, .ef-amt:focus { outline: none; border-color: #1f4e79; box-shadow: 0 0 0 3px rgba(31,78,121,.12); }
.ef-total {
  margin-top: 10px; padding-top: 8px; border-top: 1px dashed #eef2f7;
  font-size: 13px; color: #1f4e79; text-align: right;
}

/* ============ 版式切换（分开表 / 合并表） ============ */
.seg { display: inline-flex; border: 1px solid #d5dde7; border-radius: 6px; overflow: hidden; }
.seg button {
  border: none; background: #fff; padding: 6px 12px;
  font-size: 12.5px; color: #475569; cursor: pointer;
}
.seg button + button { border-left: 1px solid #e5ebf2; }
.seg button:hover { background: #f8fafc; }
.seg button.active { background: #1f4e79; color: #fff; font-weight: 600; }

/* ============ 柜体类型易漏增项提醒 ============ */
.cab-reminder {
  margin-top: 10px; padding: 7px 12px;
  background: #fffbf0; border: 1px dashed #e6c98a; border-radius: 7px;
  font-size: 12.5px; color: #92400e; line-height: 1.6;
}
.cab-reminder strong { color: #b45309; }

/* ============ 自定义增项行 ============ */
.addon-row.ca-row {
  grid-template-columns: 26px minmax(0, 1fr) 104px 62px 82px 82px;
  background: #fcfdff;
}
.addon-row .ca-del {
  width: 22px; height: 22px; line-height: 1; padding: 0;
  border: 1px solid #f3c8c8; background: #fff; color: #b91c1c;
  border-radius: 5px; cursor: pointer; font-size: 14px;
}
.addon-row .ca-del:hover { background: #fef2f2; }
.addon-row .ca-in {
  width: 100%; border: 1px solid #d5dde7; border-radius: 5px;
  padding: 4px 8px; font-size: 12.5px; background: #fff;
}
.addon-row .ca-in:focus { outline: none; border-color: #1f4e79; }
.addon-row .ca-unit { text-align: center; }
.ca-add {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 6px; padding: 8px 6px 2px;
}

/* ============ 删除密码弹窗 ============ */
#modal.plain .seg,
#modal.plain [data-act="downloadPdf"],
#modal.plain [data-act="print"] { display: none !important; }
.pw-box { padding: 16px 18px 18px; max-width: 420px; }
.pw-tip { margin: 0 0 6px; font-size: 13px; color: #1f4e79; }
.pw-warn { margin: 0 0 14px; font-size: 12px; color: #b45309; }
.pw-box .field { margin-bottom: 14px; }
.pw-box .field label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
.pw-box .field input {
  width: 100%; border: 1px solid #d5dde7; border-radius: 6px;
  padding: 7px 10px; font-size: 13px;
}
.pw-box .field input:focus { outline: none; border-color: #1f4e79; }
.pw-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* 删除按钮：比作废更淡一档，避免误点 */
.btn.ghost-danger { color: #b91c1c; background: #fff; border-color: #f3c8c8; }
.btn.ghost-danger:hover { background: #fef2f2; }

/* ============ 柜体类型编辑 ============ */
.type-item.type-off { opacity: .62; background: #fafbfc; border-radius: 8px; padding: 8px 10px; }
.type-toggle {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; color: #475569; cursor: pointer; flex: none;
  background: #f1f5f9; border-radius: 6px; padding: 4px 8px; margin-right: 2px;
}
.type-toggle input { accent-color: #1f4e79; cursor: pointer; }
.type-item.type-off .type-toggle { background: #fdecec; color: #b91c1c; }
.type-item {
  border-bottom: 1px dashed #eef2f7;
  padding-bottom: 8px; margin-bottom: 8px;
}
.type-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }

/* ============ 柜体录入表格 ============ */
/* 顶部统一设置条 */
.cab-global {
  display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap;
  background: #f4f8fc;
  border: 1px solid #dbe6f1;
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 12px;
}
.cab-global .g-title {
  font-size: 12.5px; font-weight: 700; color: #1f4e79;
  background: #e2eefa; padding: 4px 10px; border-radius: 12px;
  align-self: center; white-space: nowrap;
}
.cab-global .g-item { display: flex; flex-direction: column; gap: 3px; }
.cab-global .g-item label { font-size: 11px; color: #64748b; }
.cab-global .g-item select,
.cab-global .g-item input {
  border: 1px solid #d5dde7; border-radius: 5px;
  padding: 4px 6px; font-size: 12px; background: #fff;
  min-width: 96px;
}
.cab-global .g-item input { width: 86px; text-align: right; }
.cab-global .g-item select:focus,
.cab-global .g-item input:focus { outline: none; border-color: #1f4e79; }
.cab-global .g-item input[readonly] { background: #eef2f7; }
.cab-global .g-hint { font-size: 11px; color: #94a3b8; margin-left: auto; align-self: center; }
.cab-global .g-row { display: flex; align-items: center; gap: 4px; }
.cab-global .g-custom {
  width: 104px; border: 1px solid #e6c98a; border-radius: 5px;
  padding: 4px 6px; font-size: 12px; background: #fffbf0;
}
.cab-global .g-custom:focus { outline: none; border-color: #b45309; }
.cab-global .g-force { align-self: center; margin-left: 8px; white-space: nowrap; }

/* 品牌改名小工具 */
.rename-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 12px; padding: 10px 12px;
  background: #f7fafc; border: 1px dashed #dbe6f1; border-radius: 8px;
}
.rename-bar .rb-title { font-size: 12.5px; font-weight: 700; color: #1f4e79; }
.rename-bar select, .rename-bar input {
  border: 1px solid #d5dde7; border-radius: 5px; padding: 4px 6px; font-size: 12px; background: #fff;
}
.rename-bar input { width: 150px; }
.rename-bar .rb-arrow { color: #94a3b8; }
.rename-bar .hint { font-size: 11px; color: #94a3b8; }

.cab-table-wrap {
  overflow-x: auto;
  border: 1px solid #e3eaf2;
  border-radius: 8px;
  background: #fff;
}
.cab-table {
  width: 100%;
  min-width: 0;
  table-layout: fixed;
  border-collapse: collapse;
  font-size: 12px;
}
.cab-table thead th {
  background: #f4f8fc;
  color: #1f4e79;
  font-weight: 600;
  font-size: 11px;
  padding: 7px 4px;
  border-bottom: 1px solid #e3eaf2;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cab-table td {
  padding: 4px 4px;
  border-bottom: 1px solid #f0f4f9;
  vertical-align: top;
}
.cab-table tbody tr.cab-tr:hover { background: #fbfdff; }
.cab-table select,
.cab-table input {
  width: 100%;
  border: 1px solid #d5dde7;
  border-radius: 5px;
  padding: 3px 4px;
  font-size: 11.5px;
  background: #fff;
  box-sizing: border-box;
}
.cab-table select:focus,
.cab-table input:focus { outline: none; border-color: #1f4e79; box-shadow: 0 0 0 2px rgba(31,78,121,.1); }
.cab-table input[readonly] { background: #f1f5f9; }
.cab-table input:disabled { background: #f1f5f9; color: #cbd5e1; }
.cab-table .cell-custom {
  margin-top: 3px;
  border-color: #e6c98a;
  background: #fffbf0;
  font-size: 11.5px;
}
.cab-table .c-idx { width: 40px; text-align: center; }
.cab-table .cab-index {
  display: inline-block; font-size: 11px; font-weight: 700;
  color: #1f4e79; background: #e2eefa; padding: 1px 7px; border-radius: 9px;
}
.cab-table .c-amt {
  text-align: right; font-weight: 600; color: #1f4e79;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.cab-table .cell-tag { font-size: 10.5px; color: #94a3b8; margin-top: 2px; font-weight: 400; }
.cab-table .cell-tag.ok { color: #15803d; }
.cab-table .cell-tag.warn { color: #b45309; }
.cab-table .cell-warn { font-size: 10px; color: #b45309; margin-top: 2px; }

<script>
﻿/* 定制衣柜报价系统 v3 —— 一单多柜体 · 投影/延米双算法 · 品牌×柜体材质×门板材质组合定价 */
(function () {
  'use strict';

  const DEFAULT_SPACES = ['主卧', '次卧', '儿童房', '书房', '衣帽间', '客厅', '餐厅', '玄关', '阳台', '榻榻米', '其他'];
  const DEFAULT_CAB_NAMES = ['主卧衣柜', '次卧衣柜', '儿童房衣柜', '衣帽间', '顶天立地', '飘窗柜', '榻榻米', '书桌柜', '电视柜', '餐边柜', '鞋柜', '阳台柜', '梳妆台'];
  const DEFAULT_CAB_TYPES = [
    { name: '衣柜', standardDepth: 600, reminder: '抽屉、灯带、穿衣镜、拉直器、裤架、首饰盒' },
    { name: '餐边柜', standardDepth: 400, reminder: '灯带、玻璃门、拉篮、变压器' },
    { name: '电视柜', standardDepth: 400, reminder: '灯带、玻璃门、抽屉、托底轨道' },
    { name: '榻榻米', standardDepth: 450, reminder: '抽屉、灯带、格栅、上翻门随意停' },
    { name: '鞋柜', standardDepth: 350, reminder: '灯带、抽屉、旋转鞋架' },
    { name: '书柜', standardDepth: 350, reminder: '灯带、玻璃门、抽屉' },
    { name: '阳台柜', standardDepth: 600, reminder: '灯带、防潮处理' },
    { name: '其他柜', standardDepth: 600, reminder: '' }
  ];
  const DEFAULT_CAB_MATERIALS = ['多层实木板', '香杉木', '实木大芯（粟木）', '巴西玫瑰木'];
  const DEFAULT_DOOR_MATERIALS = ['欧松板（OSB）', '多功能板（海洋板）'];
  const MODE_AREA = 'area';
  const MODE_METER = 'meter';
  const OPT_CUSTOM = '__custom__';
  const ADDON_GROUP_ORDER = ['五金与收纳', '门板工艺', '灯光与镜面', '圆弧与收口'];

  let DB = null;
  let draft = null;
  let tab = 'booking';
  let historyQuery = '';
  let saveTimer = null;
  let dirty = false;
  let openAddonCab = null;   /* 当前展开增项面板的柜体 id */
  let sumCollapsed = false;  /* 是否收起右侧汇总，让表格更宽 */
  let pendingDeleteId = null; /* 待删除的报价记录 id */
  let historyComposing = false; /* 搜索框正在用输入法拼字 */
  let globalCab = null;        /* 「统一设置」最近一次选定的值，新增柜体时继承 */

  /* ================= 工具 ================= */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function num(v) {
    if (v === '' || v === null || v === undefined) return 0;
    const n = Number(v);
    return isFinite(n) ? n : 0;
  }
  function round2(n) { return Math.round((num(n)) * 100) / 100; }

  /* 支持在输入框里直接写算式，如 1200+300、2.4*1000 */
  function evalNum(str) {
    let s = String(str == null ? '' : str).trim();
    if (!s) return 0;
    s = s.replace(/[，,\s]/g, '').replace(/×/g, '*').replace(/÷/g, '/').replace(/＋/g, '+').replace(/－/g, '-');
    if (!/^[0-9+\-*/.()]+$/.test(s)) return null;
    try {
      const v = Function('"use strict";return (' + s + ')')();
      if (typeof v !== 'number' || !isFinite(v)) return null;
      return Math.round(v * 100) / 100;
    } catch (e) { return null; }
  }

  function readNum(el) {
    if (el.dataset && el.dataset.num !== undefined) {
      const r = evalNum(el.value);
      return r === null ? null : r;
    }
    if (el.type === 'number') return el.value === '' ? '' : Number(el.value);
    return el.value;
  }

  function normalizeNumField(el) {
    if (!el || !el.dataset || el.dataset.num === undefined) return;
    const r = evalNum(el.value);
    if (r !== null) el.value = r;
  }
  function fmt(n) { return round2(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtQty(n) { const v = round2(n); return Number.isInteger(v) ? String(v) : v.toFixed(2); }
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function stamp() {
    const d = new Date();
    const p = x => String(x).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }
  function uid(p) { return (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function setPath(obj, path, val) {
    const parts = String(path).split('.');
    let o = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      if (o[parts[i]] === undefined || o[parts[i]] === null) o[parts[i]] = {};
      o = o[parts[i]];
    }
    o[parts[parts.length - 1]] = val;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* 把某个值在「价格表 / 当前单据 / 历史单据 / 五金适用品牌」里整体替换掉 */
  function propagateValue(field, oldName, newName) {
    oldName = String(oldName == null ? '' : oldName).trim();
    newName = String(newName == null ? '' : newName).trim();
    if (!oldName || !newName || oldName === newName) return 0;
    let n = 0;

    if (field === 'brand') {
      (DB.priceRules || []).forEach(r => { if (String(r.brand || '') === oldName) { r.brand = newName; n++; } });
      (DB.config.hardwareUpgrades || []).forEach(u => {
        if (Array.isArray(u.brands)) {
          const i = u.brands.indexOf(oldName);
          if (i >= 0) { u.brands[i] = newName; n++; }
        }
      });
    } else {
      (DB.priceRules || []).forEach(r => { if (String(r[field] || '') === oldName) { r[field] = newName; n++; } });
    }

    if (draft) {
      (draft.cabinets || []).forEach(c => { if (String(c[field] || '') === oldName) { c[field] = newName; n++; } });
    }
    (DB.quotations || []).forEach(q => {
      (q.cabinets || []).forEach(c => { if (String(c[field] || '') === oldName) { c[field] = newName; n++; } });
    });
    return n;
  }

  function toast(msg, isErr) {
    const el = $('#toast');
    el.textContent = msg;
    el.style.background = isErr ? '#b91c1c' : '#1f2937';
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* ================= 数据读写 ================= */
  /* 会话失效（被停用 / 被强制下线 / 密码被改）时，自动回登录页 */
  function handleAuthLost() {
    if (window.__authLost) return;
    window.__authLost = true;
    /* 静默处理：直接弹出登录层 */
    window.__showLogin && window.__showLogin();
  }

  async function loadDb() {
    const res = await fetch('/api/db', { cache: 'no-store' });
    if (res.status === 401) { handleAuthLost(); throw new Error('登录已失效'); }
    if (!res.ok) throw new Error('读取数据失败');
    DB = await res.json();
  }
  async function putDb() {
    const res = await fetch('/api/db', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(DB)
    });
    if (res.status === 401) { handleAuthLost(); throw new Error('登录已失效'); }
    if (!res.ok) throw new Error('保存失败');
    return res.json();
  }
  function setSaveState(text) { const el = $('#saveState'); if (el) el.textContent = text; }
  function markDirty() { dirty = true; setSaveState('有未保存修改'); }
  function queueDbSave() {
    markDirty();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await putDb(); dirty = false; setSaveState('已保存'); }
      catch (e) { setSaveState('保存失败'); toast('保存失败：' + e.message, true); }
    }, 500);
  }

  /* ================= 迁移 & 默认值 ================= */
  function buildPriceRulesFromLegacyBrands() {
    const rules = [];
    (DB.brands || []).forEach(b => {
      if (b.osb === undefined) return;
      const cm = b.material || '多层实木板';
      rules.push({ id: uid('p'), brand: b.name, cabinetMaterial: cm, doorMaterial: '欧松板（OSB）', priceSqm: b.osb, priceM: null });
      if (b.ocean != null) {
        rules.push({ id: uid('p'), brand: b.name, cabinetMaterial: cm, doorMaterial: '多功能板（海洋板）', priceSqm: b.ocean, priceM: null });
      }
    });
    DB.priceRules = rules;
  }

  function migrateCabinet(c) {
    if (c.calcMode === undefined) {
      const b = (DB.brands || []).find(x => x.id === c.brandId) || null;
      c.brand = b ? b.name : ((c.customBrand && c.customBrand.name) || '');
      c.cabinetMaterial = b ? (b.material || '') : '';
      if (c.doorType === 'ocean') c.doorMaterial = '多功能板（海洋板）';
      else if (c.doorType === '__custom__') c.doorMaterial = (c.customDoor && c.customDoor.name) || '';
      else c.doorMaterial = '欧松板（OSB）';

      let p = '';
      if (c.customDoor && num(c.customDoor.price) > 0) p = String(num(c.customDoor.price));
      else if (!b && c.customBrand && num(c.customBrand.price) > 0) p = String(num(c.customBrand.price));
      else if (b) p = String(c.doorType === 'ocean' ? (b.ocean || '') : (b.osb || ''));

      c.priceInput = p;
      c.length = '';
      c.calcMode = MODE_AREA;
      delete c.brandId; delete c.doorType; delete c.customBrand; delete c.customDoor; delete c.type;
    }
    /* 五金：老数据（预设 id / 自定义）转成自由填写的名称 + 加价 */
    if (c.hardwareName === undefined && c.hardwareUpgrade !== undefined) {
      const hw = hwOf(c);
      c.hardwareName = hw.name;
      c.hardwarePrice = hw.price ? String(hw.price) : '';
      delete c.hardwareUpgrade;
      delete c.customHardware;
    }
    if (c.hardwareName === undefined) c.hardwareName = '';
    if (c.hardwarePrice === undefined) c.hardwarePrice = '';

    /* 把不在选项列表里的自由文本转为「自定义」 */
    ['brand', 'cabinetMaterial', 'doorMaterial'].forEach(f => {
      const key = f + 'Custom';
      if (c[key] === undefined) c[key] = '';
      const list = f === 'brand'
        ? allBrandNames()
        : f === 'cabinetMaterial' ? (DB.config.cabinetMaterials || []) : (DB.config.doorMaterials || []);
      const v = String(c[f] || '').trim();
      if (v && v !== OPT_CUSTOM && list.indexOf(v) < 0) {
        c[key] = v;
        c[f] = OPT_CUSTOM;
      }
    });

    if (!c.cabinetMaterial) c.cabinetMaterial = '';
    if (!c.doorMaterial) c.doorMaterial = '';
    if (!c.brand) c.brand = '';
    if (!c.type) c.type = firstCabTypeName();
    if (c.priceInput === undefined) c.priceInput = '';
    if (c.length === undefined) c.length = '';
    if (!c.customHardware) c.customHardware = { name: '', price: '' };
    if (!c.addons) c.addons = {};
    if (!c.addonPrices) c.addonPrices = {};
    if (!c.addonSpecs) c.addonSpecs = {};
    if (!c.addonDiscounts) c.addonDiscounts = {};
    if (!Array.isArray(c.customAddons)) c.customAddons = [];
    if (c.film === undefined) c.film = true;

    /* 尺寸单位统一为 mm（旧数据为米，需 ×1000） */
    if (c.dimUnit !== 'mm') {
      if (num(c.width) > 0) c.width = round2(num(c.width) * 1000);
      if (num(c.height) > 0) c.height = round2(num(c.height) * 1000);
      if (num(c.length) > 0) c.length = round2(num(c.length) * 1000);
      c.dimUnit = 'mm';
    }
    return c;
  }

  function ensureDefaults() {
    let changed = false;
    const c = DB.config = DB.config || {};

    if (!Array.isArray(c.spaces)) { c.spaces = DEFAULT_SPACES.slice(); changed = true; }
    if (!Array.isArray(c.cabinetNames)) { c.cabinetNames = DEFAULT_CAB_NAMES.slice(); changed = true; }
    if (!Array.isArray(c.cabinetTypes) || !c.cabinetTypes.length) {
      c.cabinetTypes = DEFAULT_CAB_TYPES.map(t => ({ name: t.name, standardDepth: t.standardDepth, reminder: t.reminder || '', enabled: true }));
      changed = true;
    } else {
      c.cabinetTypes = c.cabinetTypes.map(t => {
        if (typeof t === 'string') {
          changed = true;
          const seed0 = DEFAULT_CAB_TYPES.find(x => x.name === t);
          return { name: t, standardDepth: 600, reminder: seed0 ? seed0.reminder : '', enabled: true };
        }
        const nm = String(t.name || '');
        const sd = num(t.standardDepth) || 600;
        if (num(t.standardDepth) !== sd) changed = true;
        let rm;
        if (t.reminder === undefined) {
          changed = true;
          const seed = DEFAULT_CAB_TYPES.find(x => x.name === nm);
          rm = seed ? seed.reminder : '';
        } else {
          rm = String(t.reminder || '');
        }
        return { name: nm, standardDepth: sd, reminder: rm, enabled: t.enabled !== false };
      });
    }
    if (!Array.isArray(c.cabinetMaterials) || !c.cabinetMaterials.length) {
      const list = [];
      (DB.brands || []).forEach(b => { if (b.material && list.indexOf(b.material) < 0) list.push(b.material); });
      c.cabinetMaterials = list.length ? list : DEFAULT_CAB_MATERIALS.slice();
      changed = true;
    }
    if (!Array.isArray(c.doorMaterials) || !c.doorMaterials.length) { c.doorMaterials = DEFAULT_DOOR_MATERIALS.slice(); changed = true; }
    if (!Array.isArray(c.drawer)) { /* noop */ }

    if (!Array.isArray(DB.priceRules)) { buildPriceRulesFromLegacyBrands(); changed = true; }

    /* 迁移报价单里的柜体（此时 brands 仍是旧结构，可用 material/osb/ocean） */
    (DB.quotations || []).forEach(q => {
      if (!Array.isArray(q.cabinets)) {
        if (q.pricing) {
          const p = q.pricing;
          q.cabinets = [{
            id: uid('c'), space: '其他', name: '',
            brandId: p.brandId, doorType: p.doorType,
            customBrand: { name: '', price: '' },
            customDoor: { name: '', price: '' },
            hardwareName: p.hardwareName || '',
    hardwarePrice: p.hardwarePrice === undefined ? '' : p.hardwarePrice,
            customHardware: { name: '', price: '' },
            film: p.film !== false,
            width: p.width, height: p.height, depth: p.depth || '600',
            drawerQty: p.drawerQty || '',
            addons: clone(q.addons || {})
          }];
          delete q.pricing;
          delete q.addons;
        } else {
          q.cabinets = [];
        }
      }
      q.cabinets.forEach(migrateCabinet);
    });

    /* 品牌结构精简（同名品牌合并） */
    const seenNames = {};
    DB.brands = (DB.brands || []).map(b => {
      if (b.osb !== undefined) changed = true;
      return { id: b.id || uid('b'), name: b.name || '', line: b.line || '', eco: b.eco || '' };
    }).filter(b => {
      const k = b.name.trim();
      if (!k) return true;
      if (seenNames[k]) { changed = true; return false; }
      seenNames[k] = true;
      return true;
    });

    if (!Array.isArray(c.hardwareUpgrades)) { c.hardwareUpgrades = []; changed = true; }
    /* 删除报价记录的密码 */
    if (!c.deletePassword) { c.deletePassword = '123456'; changed = true; }
    /* 保底机制：低于该金额直接收全款 */
    if (c.fullPayThreshold === undefined || c.fullPayThreshold === null) { c.fullPayThreshold = 3000; changed = true; }
    /* 门店 Logo 与收款二维码（data URL，空 = 未设置） */
    if (c.logo === undefined) { c.logo = ''; changed = true; }
    if (c.payQr === undefined) { c.payQr = ''; changed = true; }
    /* 成本核算：每条价格 / 五金 / 增项都可能有自己的成本价 */
    (DB.priceRules || []).forEach(r => {
      if (r.costSqm === undefined) { r.costSqm = ''; changed = true; }
  });
    (c.hardwareUpgrades || []).forEach(u => {
      if (u.cost === undefined) { u.cost = ''; changed = true; }
    });
    (DB.addons || []).forEach(a => {
      if (a.cost === undefined) { a.cost = ''; changed = true; }
    });
    if (c.drawer && c.drawer.costPrice === undefined) { c.drawer.costPrice = ''; changed = true; }
    /* 收款四段：定金（固定金额）+ 下单货款（%）+ 出货款（余额，不固定）+ 尾款（%） */
    if (c.depositAmount === undefined || c.depositAmount === null) {
      c.depositAmount = 2000;
      changed = true;
    }
    const depAmt = Math.max(0, round2(num(c.depositAmount)));
    if (num(c.depositAmount) !== depAmt) { c.depositAmount = depAmt; changed = true; }
    if (c.orderRatio === undefined) {
      c.orderRatio = (c.arrivalRatio !== undefined) ? Math.min(Math.max(num(c.arrivalRatio), 0), 100) : 30;
      changed = true;
    }
    if (c.tailRatio === undefined) {
      c.tailRatio = (c.shipmentRatio !== undefined) ? Math.min(Math.max(num(c.shipmentRatio), 0), 100) : 10;
      changed = true;
    }
    const ordR = Math.min(Math.max(num(c.orderRatio), 0), 100);
    const tailR = Math.min(Math.max(num(c.tailRatio), 0), 100);
    if (num(c.orderRatio) !== ordR) { c.orderRatio = ordR; changed = true; }
    if (num(c.tailRatio) !== tailR) { c.tailRatio = tailR; changed = true; }

    /* 增项：补齐换算字段；灯带按 mm 录入、按米计价 */
    (DB.addons || []).forEach(a => {
      if (a.divisor === undefined) { a.divisor = 1; changed = true; }
      if (!a.calcUnit) { a.calcUnit = a.unit; changed = true; }
      if (a.unit === '延米') { a.unit = '米'; if (!a.calcUnit) a.calcUnit = '米'; changed = true; }
      if (String(a.name).indexOf('灯带') >= 0 && a.unit !== 'mm') {
        a.unit = 'mm'; a.calcUnit = '米'; a.divisor = 1000; changed = true;
      }
    });

    /* 超深加价规则 */
    if (!c.depthRule || typeof c.depthRule !== 'object') {
      c.depthRule = { enabled: true, step: 100, pricePerSqm: 0 };
      changed = true;
    }

    /* v5：一次性把空的「易漏增项提醒」补成默认文案 */
    if (DB.version !== 5) {
      (c.cabinetTypes || []).forEach(t => {
        if (t && typeof t === 'object' && !String(t.reminder || '').trim()) {
          const seed = DEFAULT_CAB_TYPES.find(x => x.name === t.name);
          if (seed && seed.reminder) t.reminder = seed.reminder;
        }
      });
      DB.version = 5;
      changed = true;
    }

    /* 报价单版式：split = 柜体/增项/其他费用分开三张表；merged = 原来的一张总表 */
    if (c.sheetLayout !== 'split' && c.sheetLayout !== 'merged') {
      c.sheetLayout = 'split';
      changed = true;
    }

    if (DB.version !== 5) { DB.version = 5; changed = true; }
    return changed;
  }

  /* ================= 价格解析 ================= */
  function firstCabTypeName() {
    const list = DB.config.cabinetTypes || [];
    /* 新建柜体用第一个「启用」的类型 */
    const on = list.filter(t => typeof t === 'string' ? true : (t.enabled !== false));
    const t = on[0] || list[0];
    if (!t) return '衣柜';
    return typeof t === 'string' ? t : t.name;
  }

  function standardDepthOf(typeName) {
    const t = (DB.config.cabinetTypes || []).find(x => (typeof x === 'string' ? x : x.name) === typeName);
    if (!t) return 0;
    return num(t.standardDepth) || 0;
  }

  /* 柜体实际最大深度（支持填两个深度，如 600 / 400） */
  function maxDepthOf(cab) {
    return Math.max(num(cab.depth), num(cab.depth2));
  }

  function depthHintText(cab) {
    const sd = standardDepthOf(cab.type);
    if (!sd) return { text: '', warn: false };
    const d2 = num(cab.depth2);
    const over = round2(maxDepthOf(cab) - sd);
    if (over <= 0) {
      return { text: '标准深度 ' + sd + ' mm' + (d2 > 0 ? '（深 ' + fmtQty(num(cab.depth)) + ' / ' + fmtQty(d2) + ' mm）' : ''), warn: false };
    }
    const rule = DB.config.depthRule || {};
    const unit = cab.calcMode === MODE_METER ? '米' : '㎡';
    const fee = (rule.enabled && num(rule.pricePerSqm) > 0)
      ? '，按每 ' + (num(rule.step) || 100) + ' mm 加 ' + rule.pricePerSqm + ' 元/' + unit + ' 计收'
      : '，超深加价金额未设置';
    const two = d2 > 0 ? '（深 ' + fmtQty(num(cab.depth)) + ' / ' + fmtQty(d2) + ' mm，按较深的一个算）' : '';
    return { text: '⚠ 超出标准深度 ' + sd + ' mm，超 ' + over + ' mm' + two + fee, warn: true };
  }

  function effName(cab, field) {
    const v = cab[field];
    if (v === OPT_CUSTOM) return String(cab[field + 'Custom'] || '').trim();
    return String(v || '').trim();
  }

  function findPriceRule(cab) {
    const rules = DB.priceRules || [];
    const brand = effName(cab, 'brand');
    const cm = effName(cab, 'cabinetMaterial');
    const dm = effName(cab, 'doorMaterial');
    if (!brand || !cm || !dm) return null;
    return rules.find(r => String(r.brand).trim() === brand && String(r.cabinetMaterial).trim() === cm && String(r.doorMaterial).trim() === dm) || null;
  }

  function resolveBackendPrice(cab) {
    const rule = findPriceRule(cab);
    if (!rule) return null;
    let p;
    if (cab.calcMode === MODE_METER) {
      /* 延米与投影同价：延米单价留空时直接沿用投影单价 */
      p = (rule.priceM === null || rule.priceM === undefined || rule.priceM === '') ? rule.priceSqm : rule.priceM;
    } else {
      p = rule.priceSqm;
    }
    if (p === null || p === undefined || p === '') return null;
    return num(p);
  }

  function cabLabel(cab) {
    if (cab.name && String(cab.name).trim()) return cab.name;
    return ((cab.space || '') + (cab.type || '')) || '柜体';
  }

  function applyAutoPrice(cab) {
    const p = resolveBackendPrice(cab);
    if (p !== null) {
      /* 重新匹配到后台价时，取消手改标记 */
      cab.priceInput = String(p);
      cab.priceManual = false;
      return true;
    }
    return false;
  }

  /* 单价的取值：手改过的优先，其次后台价 */
  function effectiveUnitPrice(cab) {
    const backend = resolveBackendPrice(cab);
    const manual = (cab.priceInput === '' || cab.priceInput === null || cab.priceInput === undefined)
      ? null : num(cab.priceInput);
    if (cab.priceManual && manual !== null) return manual;
    if (backend !== null) return backend;
    return manual || 0;
  }

  /* 手改价与后台价不一致时返回后台价，否则返回 null */
  function priceDiffFromBackend(cab) {
    const backend = resolveBackendPrice(cab);
    if (backend === null) return null;
    if (!cab.priceManual) return null;
    const manual = num(cab.priceInput);
    if (Math.abs(manual - backend) < 0.005) return null;
    return backend;
  }

  function addonPrice(cab, a) {
    const p = cab.addonPrices ? cab.addonPrices[a.id] : undefined;
    if (p !== undefined && p !== null && p !== '') return num(p);
    return num(a.price);
  }

  function addonUnitHint(a) {
    const div = num(a.divisor) || 1;
    if (div > 1) return '按 ' + a.unit + ' 输入，÷' + div + ' 换算为' + (a.calcUnit || '') + '后计价';
    return '单价 × 数量';
  }

  /* 柜体类型的「易漏增项提醒」（在设置里配置） */
  function typeReminder(cab) {
    const list = DB.config.cabinetTypes || [];
    const t = list.find(x => (typeof x === 'string' ? x : x.name) === cab.type);
    if (!t || typeof t === 'string') return '';
    return String(t.reminder || '').trim();
  }

  /* 自定义增项行（与标准增项同一套表格样式） */
  function customAddonHtml(cab) {
    const list = cab.customAddons || [];
    const rows = list.map(a =>
      '<div class="addon-row ca-row">' +
        '<button type="button" class="ca-del" data-act="delCustomAddon" data-id="' + esc(a.id) + '" title="删除">×</button>' +
        '<input class="ca-in" type="text" data-caddname="' + esc(a.id) + '" value="' + esc(a.name) + '" placeholder="自定义项目名称">' +
        '<input class="ca-in ca-spec" type="text" data-caddspec="' + esc(a.id) + '" value="' + esc(a.spec || '') + '" placeholder="规格(mm)">' +
        '<input class="ca-in ca-unit" type="text" data-caddunit="' + esc(a.id) + '" value="' + esc(a.unit || '项') + '">' +
        '<input class="apx" type="text" inputmode="decimal" data-num="1" data-caddprice="' + esc(a.id) + '" value="' + esc(a.price) + '" placeholder="单价">' +
        '<input class="aq" type="text" inputmode="decimal" data-num="1" data-caddqty="' + esc(a.id) + '" value="' + esc(a.qty) + '" placeholder="数量">' +
      '</div>').join('');
    return rows +
      '<div class="ca-add"><button type="button" class="btn small" data-act="addCustomAddon" data-cabid="' + esc(cab.id) + '">＋ 自定义增项</button>' +
      '<span class="hint" style="margin-left:8px">表格里没有的项目，可在这里临时添加</span></div>';
  }

  function isOceanDoor(cab) {
    return effName(cab, 'doorMaterial').indexOf('海洋') >= 0;
  }

  /* ================= 计算 ================= */
  function calcCabinet(cab, cfg) {
    const mode = cab.calcMode === MODE_METER ? MODE_METER : MODE_AREA;
    const unit = mode === MODE_METER ? '米' : '㎡';
    const price = effectiveUnitPrice(cab);
    const fromBackend = resolveBackendPrice(cab) !== null;

    let qty = 0, qtyNote = '';
    if (mode === MODE_METER) {
      qty = round2(num(cab.length) / 1000);
      qtyNote = '按延米计';
    } else {
      const w = num(cab.width) / 1000;
      const h = num(cab.height) / 1000;
      if (w > 0 && h > 0) {
        if (w < 1 || h < 1) { qty = round2(Math.max(w, h)); qtyNote = '宽或高不足 1 米，按长边 × 1 米计'; }
        else { qty = round2(w * h); qtyNote = '宽 × 高'; }
      }
    }

    const lines = [];
    const baseAmount = round2(qty * price);
    const nb = effName(cab, 'brand');
    const ncm = effName(cab, 'cabinetMaterial');
    const ndm = effName(cab, 'doorMaterial');
    const d1 = num(cab.depth), d2 = num(cab.depth2);
    const depthTxt = (d1 <= 0 && d2 <= 0) ? ' mm'
      : (d2 > 0 ? ' × 深 ' + fmtQty(d1) + '/' + fmtQty(d2) + ' mm' : ' × 深 ' + fmtQty(d1) + ' mm');
    const dims = mode === MODE_METER
      ? ('长 ' + fmtQty(num(cab.length)) + (num(cab.height) > 0 ? ' × 高 ' + fmtQty(num(cab.height)) : '') + depthTxt)
      : ('宽 ' + fmtQty(num(cab.width)) + ' × 高 ' + fmtQty(num(cab.height)) + depthTxt);
    const specParts = [dims];
    if (!fromBackend) specParts.push('手动单价');
    const cabRemark = String(cab.remark || '').trim();
    if (cabRemark) specParts.push('备注：' + cabRemark);
    if (qty > 0) {
      lines.push({
        name: [nb, ncm, ndm].filter(Boolean).join(' / ') || '未命名配置',
        spec: specParts.join(' · '),
        unit: unit, qty: qty, price: price, amount: baseAmount
      });
    }

    /* 超深加价 */
    let depthAmount = 0, depthOver = 0, standardDepth = 0;
    const typeDef = (cfg.cabinetTypes || []).find(t => t.name === cab.type);
    if (typeDef) standardDepth = num(typeDef.standardDepth);
    const drule = cfg.depthRule || {};
    if (standardDepth > 0 && num(cab.depth) > standardDepth) {
      depthOver = round2(maxDepthOf(cab) - standardDepth);
      if (drule.enabled && num(drule.pricePerSqm) > 0 && qty > 0) {
        const step = num(drule.step) || 100;
        const steps = Math.ceil(depthOver / step);
        const perUnit = round2(steps * num(drule.pricePerSqm));
        depthAmount = round2(perUnit * qty);
        lines.push({
          kind: 'surcharge',
          name: '超深加价',
          spec: '标准 ' + standardDepth + ' mm，超出 ' + depthOver + ' mm（' + steps + ' 档 × ' + drule.pricePerSqm + ' 元/' + unit + '）',
          unit: unit, qty: qty, price: perUnit, amount: depthAmount
        });
      }
    }

    /* 五金升级：名称与加价都可自由填写（预设方案只作为快捷选项） */
    const hwInfo = hwOf(cab);
    let hwAmount = 0;
    const hwLabel = hwInfo.name || '五金升级';
    const hwPrice = hwInfo.price;
    if (hwPrice > 0 && qty > 0) {
      hwAmount = round2(qty * hwPrice);
      lines.push({ kind: 'surcharge', name: hwLabel, spec: '五金升级', unit: unit, qty: qty, price: hwPrice, amount: hwAmount });
    }

    /* 海洋板肤感面 */
    let filmAmount = 0;
    if (isOceanDoor(cab) && cab.film && cfg.film && cfg.film.enabled && qty > 0) {
      filmAmount = round2(qty * cfg.film.price);
      lines.push({ kind: 'surcharge', name: '海洋板肤感面', spec: '海洋板门板基础上加价', unit: unit, qty: qty, price: cfg.film.price, amount: filmAmount });
    }

    /* 抽屉配比：投影按 ㎡、延米按 米，规则相同（每 N 个单位含 M 个） */
    const perUnit = num(cfg.drawer.perSqmArea) || 2;
    const perCount = num(cfg.drawer.perCount) || 1;
    const perLabel = mode === MODE_METER ? '米' : '㎡';
    const drawerQty = Math.max(0, Math.floor(num(cab.drawerQty)));
    let included = 0, extra = 0, drawerAmount = 0;
    included = qty > 0 ? Math.floor(qty / perUnit) * perCount : 0;
    extra = Math.max(0, drawerQty - included);
    if (extra > 0) {
      drawerAmount = round2(extra * cfg.drawer.extraPrice);
      lines.push({
        kind: 'drawer',
        name: '抽屉超出配比',
        spec: '每 ' + perUnit + perLabel + ' 配 ' + perCount + ' 个，超出 ' + extra + ' 个',
        unit: '个', qty: extra, price: cfg.drawer.extraPrice, amount: drawerAmount
      });
    }

    /* 特殊增项（单价可改，支持单位换算，支持单项全免/减额） */
    let addonAmount = 0;
    let addonDiscountTotal = 0;
    let addonCost = 0;          /* 增项成本 */
    (DB.addons || []).forEach(a => {
      const rawQty = num((cab.addons || {})[a.id]);
      if (rawQty > 0) {
        const price = addonPrice(cab, a);
        const div = num(a.divisor) || 1;
        const calcQty = round2(rawQty / div);
        addonCost += round2(calcQty * num(a.cost));
        const gross = round2(calcQty * price);
        const d = (cab.addonDiscounts || {})[a.id] || {};
        let amt = gross;
        let discAmt = 0;
        if (d.free) { amt = 0; discAmt = gross; }
        else {
          discAmt = Math.min(Math.max(num(d.amount), 0), gross);
          amt = round2(gross - discAmt);
        }
        addonDiscountTotal += discAmt;
        addonAmount += amt;
        const sp = [];
        const uSpec = String((cab.addonSpecs || {})[a.id] || '').trim();
        if (uSpec) sp.push(/^[0-9.]+$/.test(uSpec) ? uSpec + ' mm' : uSpec);
        sp.push(a.group);
        if (div > 1) sp.push(rawQty + ' ' + a.unit + ' ÷ ' + div + ' = ' + calcQty + ' ' + (a.calcUnit || ''));
        if (discAmt > 0) sp.push(d.free ? '全免' : '优惠 -' + fmt(discAmt));
        lines.push({
          kind: 'addon',
          name: a.name, spec: sp.filter(Boolean).join(' · '),
          unit: a.calcUnit || a.unit, qty: calcQty, price: price,
          amount: amt, gross: gross, discount: discAmt
        });
      }
    });

    /* 自定义增项（本单临时加的项目） */
    (cab.customAddons || []).forEach(a => {
      const q = num(a.qty);
      const price = num(a.price);
      const nm = String(a.name || '').trim();
      if (q > 0 && (nm || price > 0)) {
        const amt = round2(q * price);
        addonAmount += amt;
        const cs = String(a.spec || '').trim();
        lines.push({
          kind: 'addon',
          name: nm || '自定义增项',
          spec: [cs ? (/^[0-9.]+$/.test(cs) ? cs + ' mm' : cs) : '', '自定义'].filter(Boolean).join(' · '),
          unit: (String(a.unit || '').trim() || '项'),
          qty: q, price: price, amount: amt
        });
      }
    });

    addonAmount = round2(addonAmount);
    addonDiscountTotal = round2(addonDiscountTotal);

    const subtotal = round2(baseAmount + depthAmount + hwAmount + filmAmount + drawerAmount + addonAmount);

    /* ---------- 成本核算 ---------- */
    const ruleForCost = (typeof findPriceRule === 'function') ? findPriceRule(cab) : null;
    const costSqm = ruleForCost ? num(ruleForCost.costSqm) : 0;
    const materialCost = (costSqm > 0 && qty > 0) ? round2(qty * costSqm) : 0;
    const hwCostUnit = (() => {
      const nm = hwOf(cab).name;
      const u = (cfg.hardwareUpgrades || []).find(x => x.name === nm);
      return u ? num(u.cost) : 0;
    })();
    const hardwareCost = (hwCostUnit > 0 && qty > 0) ? round2(qty * hwCostUnit) : 0;
    const drawerCost = round2(extra * num(cfg.drawer && cfg.drawer.costPrice));
    const costTotal = round2(materialCost + hardwareCost + addonCost + drawerCost);

    return {
      cab: cab, mode: mode, unit: unit, qty: qty, qtyNote: qtyNote, price: price, fromBackend: fromBackend,
      baseAmount: baseAmount, depthAmount: depthAmount, depthOver: depthOver, standardDepth: standardDepth,
      hwAmount: hwAmount, filmAmount: filmAmount,
      drawerAmount: drawerAmount, addonAmount: addonAmount, addonDiscountTotal: addonDiscountTotal,
      included: included, extra: extra, drawerQty: drawerQty,
      subtotal: subtotal, lines: lines,
      cost: {
        material: materialCost, hardware: hardwareCost, addon: round2(addonCost),
        drawer: drawerCost, total: costTotal,
        missingMaterial: (costSqm <= 0 && qty > 0)
      }
    };
  }

  function calc(d) {
    d = d || {};
    const cfg = DB.config;
    const disc = d.discount || { type: 'none', value: 0 };
    const pay = d.payment || { depositAmount: cfg.depositAmount, orderRatio: cfg.orderRatio, tailRatio: cfg.tailRatio };

    const cabs = (d.cabinets || []).map(c => calcCabinet(c, cfg));
    const cabSubtotal = round2(cabs.reduce((s, x) => s + x.subtotal, 0));
    const addonAmountTotal = round2(cabs.reduce((s, x) => s + (x.addonAmount || 0), 0));
    const cabAmountTotal = round2(cabSubtotal - addonAmountTotal);
    const totalArea = round2(cabs.reduce((s, x) => s + (x.mode === MODE_METER ? 0 : x.qty), 0));
    const totalMeter = round2(cabs.reduce((s, x) => s + (x.mode === MODE_METER ? x.qty : 0), 0));
    const extraFeeTotal = round2((d.extraFees || []).reduce((s, f) => s + num(f.amount), 0));
    const subtotal = round2(cabSubtotal + extraFeeTotal);
    const addonDiscountTotal = round2(cabs.reduce((s, x) => s + (x.addonDiscountTotal || 0), 0));

    const discountAmount = 0;
    const finalTotal = round2(subtotal);

    /* ---------- 成本合计 / 毛利 ---------- */
    const costMaterial = round2(cabs.reduce((s, x) => s + (x.cost ? x.cost.material : 0), 0));
    const costHardware = round2(cabs.reduce((s, x) => s + (x.cost ? x.cost.hardware : 0), 0));
    const costAddon = round2(cabs.reduce((s, x) => s + (x.cost ? x.cost.addon : 0), 0));
    const costDrawer = round2(cabs.reduce((s, x) => s + (x.cost ? x.cost.drawer : 0), 0));
    const costMissing = cabs.some(x => x.cost && x.cost.missingMaterial);
    const otherCost = round2(num(d.otherCost));
    const totalCost = round2(costMaterial + costHardware + costAddon + costDrawer + otherCost);
    const grossProfit = round2(finalTotal - totalCost);
    const grossMargin = finalTotal > 0 ? round2(grossProfit / finalTotal * 100) : 0;

    /* 收款方式：先用总价减去定金，剩下的金额再按百分比拆分
       四段：定金（固定）+ 下单货款（剩余×%）+ 出货款（余额）+ 尾款（剩余×%）
       若定金已超过「剩余金额算出的下单货款」，改用三段：定金 + 下单货款（自定义）+ 尾款 */
    const depInput = Math.max(0, round2(num(pay.depositAmount)));
    const ordR = Math.min(Math.max(num(pay.orderRatio), 0), 100);
    const tailR = Math.min(Math.max(num(pay.tailRatio), 0), 100);

    /* 保底机制：合计金额低于门槛（默认 3000）时直接收全款，避免定金过大导致比例失控；门槛填 0 = 关闭 */
    const fullPayThreshold = Math.max(0, round2(num(cfg.fullPayThreshold)));
    const fullPay = fullPayThreshold > 0 && finalTotal > 0 && finalTotal < fullPayThreshold;

    const depositClamped = round2(Math.min(depInput, finalTotal));
    const baseRemain = Math.max(0, round2(finalTotal - depositClamped));
    const orderPctTotal = round2(baseRemain * ordR / 100);
    const threeMode = !fullPay && finalTotal > 0 && depInput > orderPctTotal;
    const nineTenths = round2(finalTotal * 0.9);

    let deposit, orderTotal, tailTotal, shipTotal;
    if (fullPay) {
      deposit = finalTotal;
      orderTotal = 0;
      tailTotal = 0;
      shipTotal = 0;
    } else if (threeMode) {
      deposit = depositClamped;
      const maxOrder = Math.max(0, round2(finalTotal - deposit));
      orderTotal = Math.max(0, Math.min(round2(num(pay.customOrderAmount)), maxOrder));
      tailTotal = round2(finalTotal - deposit - orderTotal) || 0;
      shipTotal = 0;
    } else {
      deposit = depositClamped;
      orderTotal = orderPctTotal;
      tailTotal = round2(baseRemain * tailR / 100);

      /* 下单 + 尾款超过剩余金额时，依次压缩尾款、下单货款 */
      let excess = round2(orderTotal + tailTotal - baseRemain);
      if (excess > 0) {
        const tailCut = Math.min(excess, tailTotal);
        tailTotal = round2(tailTotal - tailCut);
        excess = round2(excess - tailCut);
        if (excess > 0) {
          const ordCut = Math.min(excess, orderTotal);
          orderTotal = round2(orderTotal - ordCut);
          excess = round2(excess - ordCut);
        }
      }
      shipTotal = round2(baseRemain - orderTotal - tailTotal) || 0;
    }

    const depositOver = fullPay ? 0 : Math.max(0, round2(depInput - deposit));
    const orderEff = (!fullPay && baseRemain > 0) ? round2(orderTotal / baseRemain * 100) : 0;
    const tailEff = (!fullPay && baseRemain > 0) ? round2(tailTotal / baseRemain * 100) : 0;
    const compressed = !fullPay && !threeMode && ((orderEff !== ordR) || (tailEff !== tailR));

    return {
      cabinets: cabs, cabSubtotal: cabSubtotal, extraFeeTotal: extraFeeTotal,
      cabAmountTotal: cabAmountTotal, addonAmountTotal: addonAmountTotal,
      totalArea: totalArea, totalMeter: totalMeter,
      totalQty: round2(totalArea + totalMeter),
      totalUnit: (totalMeter > 0 && totalArea <= 0) ? '米' : '㎡',
      subtotal: subtotal, addonDiscountTotal: addonDiscountTotal,
      originalTotal: round2(subtotal + addonDiscountTotal),
      discountAmount: discountAmount, finalTotal: finalTotal,
      depositAmount: depInput, deposit: deposit, depositOver: depositOver, baseRemain: baseRemain,
      orderRatio: ordR, orderEff: orderEff, orderTotal: orderTotal, orderPctTotal: orderPctTotal,
      shipTotal: shipTotal, tailRatio: tailR, tailEff: tailEff, tailTotal: tailTotal,
      threeMode: threeMode, nineTenths: nineTenths, compressed: compressed,
      fullPay: fullPay, fullPayThreshold: fullPayThreshold,
      cost: {
        material: costMaterial, hardware: costHardware, addon: costAddon,
        drawer: costDrawer, other: otherCost, total: totalCost,
        profit: grossProfit, margin: grossMargin, missing: costMissing
      }
    };
  }

    const tail = Math.min(Math.max(num(cfg.tailRatio), 0), 100);
    return {

  function loadIntoDraft(q) {
    draft = clone(q);
    if (!Array.isArray(draft.cabinets)) draft.cabinets = [newCabinet()];
    if (!Array.isArray(draft.extraFees)) draft.extraFees = [];
    draft.cabinets.forEach(migrateCabinet);
    if (!draft.discount) draft.discount = { type: 'none', value: 0 };
    if (!draft.payment) draft.payment = { depositAmount: DB.config.depositAmount, orderRatio: DB.config.orderRatio, tailRatio: DB.config.tailRatio, customOrderAmount: '' };
    if (draft.payment.tailRatio === undefined) draft.payment.tailRatio = num(DB.config.tailRatio);
    if (draft.payment.customOrderAmount === undefined) draft.payment.customOrderAmount = '';
    switchTab('booking');
    render();
  }

  /* 五金：优先用柜体上自由填的名称/加价；老数据回退到预设方案 id */
  function hwOf(cab) {
    let name = String(cab.hardwareName == null ? '' : cab.hardwareName).trim();
    let price = num(cab.hardwarePrice);
    if (cab.hardwareName === undefined && cab.hardwareUpgrade !== undefined) {
      if (cab.hardwareUpgrade === '__custom__') {
        name = String((cab.customHardware && cab.customHardware.name) || '').trim();
        price = num(cab.customHardware && cab.customHardware.price);
      } else {
        const u = (DB.config.hardwareUpgrades || []).find(x => x.id === cab.hardwareUpgrade);
        if (u) { name = u.name; price = num(u.price); }
      }
    }
    return { name: name, price: price };
  }

  /* 通用下拉浮层（用于空间 / 五金这类「可自由输入又想看全列表」的字段） */
  let comboPop = null;

  function ensureComboPop() {
    if (!comboPop) {
      comboPop = document.createElement('div');
      comboPop.className = 'combo-pop';
      comboPop.style.display = 'none';
      document.body.appendChild(comboPop);
      comboPop.addEventListener('mousedown', e => {
        const b = e.target.closest('button[data-val]');
        if (!b) return;
        e.preventDefault();
        const inp = comboPop._input;
        if (inp && inp.isConnected) {
          inp.value = b.dataset.val;
          inp.dispatchEvent(new Event('input', { bubbles: true }));
          inp.dispatchEvent(new Event('change', { bubbles: true }));
        }
        closeComboPop();
      });
    }
    return comboPop;
  }

  /* 内容渲染：支持「边输入边过滤」的搜索模式 */
  function renderComboPop() {
    if (!comboPop) return;
    const pop = comboPop;
    const input = pop._input;
    const cur = String((input && input.value) || '').trim();
    const all = pop._list || [];
    let list = all.slice();
    if (pop._filter && cur) {
      const q = cur.toLowerCase();
      list = list.filter(v => String(v).toLowerCase().indexOf(q) >= 0);
    }
    pop.innerHTML = list.length
      ? list.map(v => '<button type="button" data-val="' + esc(v) + '"' + (v === cur ? ' class="active"' : '') + '>' + esc(v) + '</button>').join('')
      : '<div class="combo-empty">' + (all.length
          ? '没有匹配「' + esc(cur) + '」的名称，保存报价时会自动收进名称库'
          : '暂无选项，直接输入即可') + '</div>';
    if (pop._filter && cur && list.length && list.length < all.length) {
      pop.insertAdjacentHTML('beforeend', '<div class="combo-count">匹配 ' + list.length + ' / ' + all.length + '</div>');
    }
  }

  function openComboPop(input, list, opts) {
    const pop = ensureComboPop();
    pop._input = input;
    pop._list = (list || []).slice();
    pop._filter = !!(opts && opts.filter);
    renderComboPop();
    pop.style.display = 'block';
    const r = input.getBoundingClientRect();
    const h = Math.min(280, 12 + pop._list.length * 30);
    let top = r.bottom + 4;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
    pop.style.left = Math.round(r.left) + 'px';
    pop.style.top = Math.round(top) + 'px';
    pop.style.minWidth = Math.max(160, Math.round(r.width) + 46) + 'px';
  }

  function closeComboPop() {
    if (comboPop) { comboPop.style.display = 'none'; comboPop._input = null; comboPop._list = null; }
  }

    else if (tab === 'history') view.innerHTML = renderHistory();
    else if (tab === 'cost') view.innerHTML = renderCost();

  /* ================= 成本毛利页（管理员） ================= */
  function renderCost() {
    const list = (DB.quotations || []).slice().sort((a, b) =>
      String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || '')));

    let tSell = 0, tCost = 0;
    const rows = list.map(q => {
      const c = calc(q);
      const ct = c.cost;
      tSell += c.finalTotal;
      tCost += ct.total;
      const margin = c.finalTotal > 0 ? round2(ct.profit / c.finalTotal * 100) : 0;
      const cls = ct.profit >= 0 ? (margin >= 25 ? 'ok' : 'warn') : 'bad';
      const st = q.status || 'quoted';
      const stTxt = { draft: '草稿', preset: '待填写', filled: '待报价', quoted: '已报价', deal: '已成交', void: '已作废' }[st] || st;
      return '<tr>' +
        '<td>' + esc(q.quotationNo || '（草稿）') + '</td>' +
        '<td>' + esc((q.customer && q.customer.name) || '—') + '</td>' +
        '<td class="addr-cell" title="' + esc((q.customer && q.customer.address) || '') + '">' +
          esc((q.customer && q.customer.address) || '—') + '</td>' +
        '<td>' + esc((q.updatedAt || q.createdAt || '').slice(0, 10)) + '</td>' +
        '<td><span class="status ' + st + '">' + stTxt + '</span></td>' +
        '<td class="num">¥' + fmt(c.finalTotal) + '</td>' +
        '<td class="num" title="板材 ¥' + fmt(ct.material) + ' · 五金 ¥' + fmt(ct.hardware) +
          ' · 增项 ¥' + fmt(ct.addon) + ' · 抽屉 ¥' + fmt(ct.drawer) + '">¥' + fmt(ct.total) + '</td>' +
        '<td class="num"><input class="mini-input cost-other" type="number" step="0.01" data-costother="' +
          esc(q.id) + '" value="' + (ct.other ? ct.other : '') + '" placeholder="0"></td>' +
        '<td class="num" style="font-weight:600;color:' + (ct.profit >= 0 ? '#1f4e79' : '#b91c1c') + '">¥' + fmt(ct.profit) + '</td>' +
        '<td class="num"><span class="margin ' + cls + '">' + margin + '%</span></td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="10"><div class="empty">暂无报价记录</div></td></tr>';

    const tProfit = round2(tSell - tCost);
    const tMargin = tSell > 0 ? round2(tProfit / tSell * 100) : 0;

    return '<section class="card">' +
